title: Suspicious npm Postinstall Script Credential Exfiltration
id: ""
status: draft
description: Detects npm postinstall scripts attempting to exfiltrate environment variables such as GITHUB_TOKEN or NPM_TOKEN, download second-stage payloads, or execute suspicious commands. This behavior is indicative of a compromised npm package, as seen in the Tensorlake incident and similar supply chain attacks exploiting trusted publishing configurations.
references:
  - https://thehackernews.com/2026/10/github-tightens-npm-publishing-after.html
  - https://github.blog/changelog/2026-10-02-unvalidated-npm-trusted-publishing-configurations-now-expire/
  - https://docs.npmjs.com/trusted-publishers#trusted-publisher-configuration-expiry
  - https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow
  - https://docs.npmjs.com/generating-provenance-statements
  - https://thehackernews.com/2026/10/tensorlake-npm-package-compromised-to.html
  - https://bloom.security/blog/slugfest-millions-of-ai-agents-download-exposed-npm-packages
  - https://bloom.security/blog/extension-resurrection
author: ""
date: 2026/10/02
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|endswith:
      - '/npm'
      - '/node'
    ParentCommandLine|contains:
      - 'npm install'
      - 'npm ci'
      - 'yarn install'
      - 'pnpm install'
  selection_suspicious_cmd:
    CommandLine|contains:
      - 'GITHUB_TOKEN'
      - 'NPM_TOKEN'
      - 'process.env'
      - 'curl '
      - 'wget '
      - 'base64 -d'
      - 'bash -i'
      - 'node -e'
      - 'child_process'
      - 'net.connect'
      - 'https://'
      - 'http://'
  selection_suspicious_bin:
    Image|endswith:
      - '/curl'
      - '/wget'
      - '/bash'
      - '/sh'
      - '/node'
      - '/python'
      - '/python3'
      - '/base64'
  condition: selection_parent and (selection_suspicious_cmd or selection_suspicious_bin)
falsepositives:
  - Legitimate packages that use postinstall scripts to download prebuilt binaries (e.g., node-sass, puppeteer).
  - Packages that access environment variables for configuration during installation.
  - CI/CD pipelines that run npm install with custom scripts.
level: high
tags:
  - attack.supply_chain_compromise
  - attack.t1195.001
  - attack.command_and_scripting_interpreter
  - attack.t1059
  - attack.credential_access
  - attack.t1552
  - attack.exfiltration
  - attack.t1041