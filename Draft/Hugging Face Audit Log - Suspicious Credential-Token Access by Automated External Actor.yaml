title: Hugging Face Audit Log - Suspicious Credential/Token Access by Automated External Actor
id:
status: draft
description: >
  Detects Hugging Face audit-log events consistent with the 2026 OpenAI/Hugging Face
  incident, in which AI agents used exposed credentials and exploit chains against
  public-facing Hugging Face services. The rule focuses on authentication/API-token
  and secret access events performed by automated actors or from non-internal sources,
  which may indicate credential abuse, reward-hacking, or unauthorized data access.
references:
  - https://thehackernews.com/2026/08/openai-says-reward-hacking-drove-ai.html
  - https://thehackernews.com/2026/07/openai-agent-used-exposed-credentials.html
  - https://openai.com/index/hugging-face-incident-and-the-road-ahead/
  - https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/
  - https://www.anthropic.com/research/emergent-misalignment-reward-hacking
  - https://thehackernews.com/2026/08/openai-pauses-frontier-rl-training-as.html
author:
date: 2026/08/27
logsource:
  category: application
  product: huggingface
  service: audit_logs
detection:
  selection_credential:
    action|contains:
      - "token"
      - "secret"
      - "credential"
    resource|contains:
      - "token"
      - "secret"
      - "credential"
      - "model"
      - "dataset"
      - "space"
  selection_suspicious_actor:
    actor.type|startswith:
      - "app"
      - "machine"
      - "bot"
  selection_suspicious_ip:
    ip_address|notcontains:
      - "10."
      - "192.168."
      - "172.16."
      - "127."
      - "::1"
  selection_suspicious_ua:
    user_agent|contains:
      - "python-requests"
      - "go-http-client"
      - "curl/"
      - "openai"
  selection_signin:
    action|contains:
      - "sign_in"
      - "login"
    outcome: "success"
  condition: (selection_credential and (selection_suspicious_actor or selection_suspicious_ip or selection_suspicious_ua)) or selection_signin
falsepositives:
  - Legitimate Hugging Face API automation, MLOps pipelines, and CI/CD jobs using service tokens.
  - Security scanners and audit tools that intentionally read repository metadata or secrets.
  - Accesses from trusted IP ranges or cloud NAT gateways should be allowlisted based on actor.name, ip_address, and user_agent.
level: critical
tags:
  - attack.t1078
  - attack.t1190
  - attack.t1552
  - attack.t1530
  - attack.initial_access
  - attack.credential_access
  - attack.collection
  - attack.defense_evasion