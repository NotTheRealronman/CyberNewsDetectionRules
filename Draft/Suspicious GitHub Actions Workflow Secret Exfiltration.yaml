title: Suspicious GitHub Actions Workflow Secret Exfiltration
id: 
status: draft
description: Detects suspicious commands and exfiltration attempts within GitHub Actions workflow logs, indicative of credential-stealing workflows planted by threat actors (e.g., GhostAction campaign). Attackers modify or create workflows to dump and exfiltrate repository secrets, tokens, and cloud credentials to attacker-controlled infrastructure.
references:
  - https://thehackernews.com/2026/10/credential-stealing-github-actions.html
  - https://www.stepsecurity.io/blog/ghostaction-returns
  - https://socket.dev/blog/ghostaction-cloud-credentials
  - https://www.stepsecurity.io/blog/ghostaction-campaign-over-3-000-secrets-stolen-through-malicious-github-workflows
  - https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/
author: 
date: 2026-05-09
logsource:
  category: application
  product: github
  service: actions
detection:
  selection_cmd:
    message|contains:
      - 'curl'
      - 'wget'
  selection_exfil:
    message|contains:
      - 'toJSON(secrets)'
      - 'printenv'
      - 'base64'
      - 'GITHUB_TOKEN'
      - 'ACTIONS_RUNTIME_TOKEN'
      - 'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
      - '${{ secrets'
  selection_domain:
    message|contains:
      - 'webhook.site'
      - 'pipedream.net'
      - 'ngrok.io'
      - 'interact.sh'
      - 'oast.pro'
      - 'oast.fun'
      - 'oast.me'
      - 'telegram.org'
      - 'discord.com/api/webhooks'
      - 'pastebin.com'
      - 'transfer.sh'
      - 'file.io'
      - '0x0.st'
      - 'requestbin.net'
      - 'hookbin.com'
      - 'burpcollaborator.net'
  condition: (selection_cmd and selection_exfil) or selection_domain
falsepositives:
  - Legitimate use of curl/wget to webhook.site or similar services for debugging or testing in non-production environments.
  - Debugging workflows that print environment variables or secrets (should be discouraged and replaced with secure practices).
  - Legitimate CI/CD pipelines that use base64 encoding for non-sensitive data.
  - Security scanning tools that intentionally test for exfiltration.
  - Actions that upload artifacts to cloud storage using curl/wget with base64 encoding.
level: high
tags:
  - attack.credential_access
  - attack.exfiltration
  - attack.t1552.001
  - attack.t1567.002
  - attack.t1071.001
  - attack.t1195.002