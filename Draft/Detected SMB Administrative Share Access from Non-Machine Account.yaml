title: Detected SMB Administrative Share Access from Non-Machine Account
id:
status: draft
description: Detects access to Windows administrative shares (ADMIN$ and C$) via SMB. This activity is commonly used for lateral movement after an attacker compromises an edge-facing device and moves inside the enterprise network, where internal segmentation and monitoring may be weaker.
references:
  - https://thehackernews.com/2026/08/enterprise-defenses-recovered-at-edge.html
  - https://hubs.li/Q04s3wdR0
  - https://www.picussecurity.com/platform/autonomous-penetration-testing
  - https://www.linkedin.com/in/silaozeren/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-05-07
logsource:
  category: security
  product: windows
  service: security
detection:
  selection:
    EventID: 5140
    ShareName|endswith:
      - 'C$'
      - 'ADMIN$'
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and not filter
falsepositives:
  - Legitimate administrative share access for remote troubleshooting by IT administrators.
  - Authorized software deployment and backup tools that use admin shares.
  - Domain controller replication and management activity using machine accounts. Whitelist known administrative hosts, service accounts, and management software to reduce noise.
level: high
tags:
  - attack.lateral_movement
  - attack.t1021.002
  - attack.t1078
  - attack.t1133
  - attack.t1190