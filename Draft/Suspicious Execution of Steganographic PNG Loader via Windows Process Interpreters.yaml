title: Suspicious Execution of Steganographic PNG Loader via Windows Process Interpreters
id: ""
status: draft
description: Detects process creation consistent with BubbleLoader-style PNG steganography malware loaders, where Windows script/loader interpreters are invoked with a .png path from user-writable directories and suspicious download, encoding, or obfuscation flags. The rule is intended to identify execution, defense evasion, and command-and-control behaviors described in the ThreatDay article covering BubbleLoader PNG malware.
references:
  - https://thehackernews.com/2026/11/threatsday-gpt-62-jailbreak-flaws.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026/05/07
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    Image|endswith:
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\mshta.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  selection_png:
    CommandLine|contains:
      - '.png'
  selection_paths:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\ProgramData\'
      - '\Windows\Temp\'
  selection_susp:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'javascript:'
      - 'vbscript:'
      - 'FromBase64String'
      - 'Invoke-Expression'
      - 'IEX'
      - 'DownloadString'
      - 'bitsadmin'
      - 'certutil'
      - ' -enc '
      - ' -e '
      - ' -w hidden'
      - ' --headless'
  condition: selection_img and selection_png and selection_paths and selection_susp
falsepositives:
  - Legitimate software installers or administrative scripts that reference PNG images from temporary or user-writable directories while using download, encoding, or hidden-window options.
  - Approved PowerShell, mshta, rundll32, regsvr32, or script-host activity with signed binaries and known parent processes. Whitelist by process hash, signer, parent image, full command line, and destination URL/domain.
level: high
tags:
  - attack.execution
  - attack.t1059
  - attack.t1059.001
  - attack.t1059.005
  - attack.t1059.007
  - attack.t1218.010
  - attack.t1218.011
  - attack.t1204.002
  - attack.defense_evasion
  - attack.t1027
  - attack.t1140
  - attack.t1105
  - attack.command_and_control
  - attack.t1071.001