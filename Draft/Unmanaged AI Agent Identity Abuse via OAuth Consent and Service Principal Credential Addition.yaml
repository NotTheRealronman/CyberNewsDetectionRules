title: Unmanaged AI Agent Identity Abuse via OAuth Consent and Service Principal Credential Addition
id: ''
status: draft
description: >
  Detects suspicious activity consistent with an unowned/unmanaged AI agent
  (non-human identity) being granted persistent access to an Entra ID /
  Microsoft 365 tenant. AI agents are frequently created by business units,
  granted broad delegated or application permissions, and then left without a
  clear owner or lifecycle - which makes them an ideal insider threat and a
  silent data-exfiltration channel. The rule alerts on the combination of an
  OAuth consent / delegated permission grant / service principal credential
  addition event with high-impact scopes such as Mail.ReadWrite,
  Files.ReadWrite.All, Sites.ReadWrite.All, Chat.Read.All and offline_access,
  which allow the agent (or an attacker who compromises the agent's secret) to
  read and exfiltrate mail, files and chat data, persist via a new client
  secret/certificate, and retain access after the owning user is disabled.
references:
  - https://thehackernews.com/2026/10/the-ai-agent-nobody-owns-watch-expert.html
  - https://thehacker.news/ai-insider-threat
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ''
date: 2026/10/15
logsource:
  product: azure
  service: auditlogs
detection:
  selection_operation:
    Operation:
      - 'Consent to application.'
      - 'Add OAuth2PermissionGrant.'
      - 'Add delegated permission grant.'
      - 'Add service principal credentials.'
      - 'Update application – Certificates and secrets management.'
      - 'Add app role assignment grant to user.'
      - 'Add owner to application.'
      - 'Add service principal.'
  selection_sensitive_scope:
    - 'Mail.ReadWrite'
    - 'Mail.Read'
    - 'Mail.Send'
    - 'Files.ReadWrite.All'
    - 'Sites.ReadWrite.All'
    - 'Chat.Read.All'
    - 'Chat.ReadWrite.All'
    - 'offline_access'
    - 'Directory.ReadWrite.All'
    - 'RoleManagement.ReadWrite.Directory'
    - 'AppRoleAssignment.ReadWrite.All'
  selection_agent_naming:
    TargetResources|contains:
      - 'agent'
      - 'Agent'
      - 'copilot'
      - 'Copilot'
      - 'assistant'
      - 'Assistant'
      - 'bot'
      - 'Bot'
  filter_trusted_first_party:
    InitiatedBy|contains:
      - 'Microsoft Services'
      - 'Microsoft Corporation'
  filter_known_tenant_apps:
    TargetResources|contains:
      - 'aebc6443-996d-45c2-90f0-388ff96faa56'
      - '00000002-0000-0ff1-ce00-000000000000'
      - '00000003-0000-0ff1-ce00-000000000000'
  condition: selection_operation and selection_sensitive_scope and not filter_trusted_first_party and not filter_known_tenant_apps
falsepositives:
  - Legitimate IT-approved onboarding of a sanctioned AI agent or automation platform (Copilot, Power Automate, custom LangChain/AutoGen/Azure AI service principal) performed under an approved change ticket - whitelist the specific application ID and initiator in filter_known_tenant_apps.
  - Service principal secret rotation or renewal executed by a CI/CD pipeline or secrets vault (e.g., HashiCorp Vault, GitHub Actions) - exclude the pipeline's service principal object ID.
  - Tenant-wide admin consent granted during an approved Microsoft 365 Copilot or AI pilot rollout - scope the filter by consented application AppId.
  - Recommend the IT team maintain an inventory of non-human identities with named owners, and alert separately on any agent identity with no owner assigned or with secrets older than the rotation policy.
level: high
tags:
  - attack.initial_access
  - attack.persistence
  - attack.privilege_escalation
  - attack.credential_access
  - attack.collection
  - attack.exfiltration
  - attack.t1078.004
  - attack.t1098.001
  - attack.t1528
  - attack.t1550.001
  - attack.t1119