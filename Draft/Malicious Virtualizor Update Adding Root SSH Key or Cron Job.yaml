title: Malicious Virtualizor Update Adding Root SSH Key or Cron Job
id: ""
status: draft
description: >
  Detects Linux process creation events where a child process spawned by the
  Virtualizor update/application path attempts to establish root persistence by
  modifying SSH authorized_keys or creating cron entries. This behavior was
  observed after a BGP hijack delivered a malicious Virtualizor 3.2.9 RC update
  that established persistent root access on affected servers.
references:
  - 'https://thehackernews.com/2026/09/bgp-hijack-delivers-malicious.html'
  - 'https://www.virtualizor.com/blog/security-incident-bgp-hijacking/'
  - 'https://stat.ripe.net/data/bgp-updates/data.json?resource=162.55.80.0%2F24&starttime=2026-08-28T20%3A50%3A00&endtime=2026-08-30T10%3A00%3A00'
  - 'https://lowendtalk.com/discussion/comment/4856297/'
  - 'https://www.virtualizor.com/blog/virtualizor-3-2-9-launched-release-candidate-patch-9/'
  - 'https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ'
author: ""
date: 2026-09-05
logsource:
  category: process_creation
  product: linux
  service: auditd
detection:
  selection_virtualizor:
    ParentImage|contains:
      - '/usr/local/virtualizor'
  selection_ssh_persistence:
    CommandLine|contains:
      - 'authorized_keys'
      - '.ssh/'
      - 'ssh-rsa'
  selection_cron_persistence:
    CommandLine|contains:
      - '/etc/cron.d/'
      - '/etc/crontab'
      - '/var/spool/cron/'
      - 'cron.d/'
      - '| crontab'
  condition: selection_virtualizor and (selection_ssh_persistence or selection_cron_persistence)
falsepositives:
  - Legitimate Virtualizor administrator actions that deploy SSH keys through the control panel.
  - Legitimate Virtualizor scheduled tasks or maintenance routines that invoke crontab as part of normal operation.
  - Whitelist known administrator accounts, management hosts, and maintenance windows used for authorized key or cron management.
level: high
tags:
  - attack.t1195
  - attack.t1195.002
  - attack.t1053.003
  - attack.t1098.004