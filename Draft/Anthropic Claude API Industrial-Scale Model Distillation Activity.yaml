title: Anthropic Claude API Industrial-Scale Model Distillation Activity
id:
status: draft
description: Detects automated, high-volume Claude API usage consistent with industrial-scale model distillation, including repetitive prompt/response harvesting, fraudulent account creation, proxy usage, and extraction of model outputs for training competing models.
references:
  - https://thehackernews.com/2026/09/anthropic-says-seven-china-based-ai.html
  - https://www.gov.uk/government/publications/ai-insights/ai-insights-model-distillation-html
  - https://www.ibm.com/think/topics/knowledge-distillation
  - https://thehackernews.com/2026/09/autonomous-ai-agents-compromise.html
  - https://thehackernews.com/2025/01/deepseek-ai-database-exposed-over-1.html
  - https://www.anthropic.com/threat-intelligence-report-september-2026#illicit-distillation-sep-26
  - https://thehackernews.com/2026/09/infostealer-logs-expose-replayable-ai.html
  - https://thehackernews.com/2026/09/claude-used-to-automate-exploitation.html
  - https://thehackernews.com/2026/09/us-agencies-accuse-china-ai-firms-of.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: '2026-09-24'
logsource:
  category: application
  product: anthropic
  service: claude_api
detection:
  selection_api:
    request.path:
      - '/v1/messages'
      - '/v1/complete'
      - '/v1/chat/completions'
  selection_automation:
    user_agent:
      - '*python-requests*'
      - '*httpx*'
      - '*aiohttp*'
      - '*go-http-client*'
      - '*curl*'
      - '*wget*'
      - '*PostmanRuntime*'
      - '*okhttp*'
  selection_keywords:
    request.body|contains:
      - 'distillation'
      - 'knowledge distillation'
      - 'model extraction'
      - 'model stealing'
      - 'synthetic data generation'
      - 'generate training data'
      - 'train a competing model'
      - 'replicate Claude'
      - 'mimic Claude'
      - 'clone model'
      - 'extract capabilities'
  selection_high_tokens:
    response.usage.output_tokens|gte: 8192
  selection_new_account:
    event_type: 'account_created'
    account_age_days|lt: 1
  condition: selection_api and (selection_automation or selection_keywords or selection_new_account or selection_high_tokens) | count() by source.ip > 1000
falsepositives:
  - Legitimate AI research, red teaming, model evaluation, academic distillation research, QA testing, and internal automation using Claude API.
  - High-volume API users with authorized bulk processing or synthetic data generation workflows.
  - Service accounts and CI/CD pipelines using Python, curl, or other HTTP clients.
  - Use of proxy, VPN, or cloud IP ranges for legitimate remote work or distributed systems.
level: high
tags:
  - attack.t1585.003
  - attack.t1078.004
  - attack.t1090
  - attack.t1119
  - attack.t1567
  - attack.t1496
  - attack.t1059
  - attack.t1071.001