title: Shai-Hulud npm Worm Credential Harvesting and GitHub Exfiltration
id:
status: draft
description: Detects process execution patterns associated with the Shai-Hulud npm supply chain worm, including malicious postinstall scripts (setup_bun.js, bundle.js), Bun runtime download and execution, TruffleHog credential scanning, and GitHub API exfiltration. This worm can propagate through compromised npm packages and hijacked AI coding assistant sessions, pushing malicious commits across repositories.
references:
  - https://thehackernews.com/2026/09/attacker-hijacks-ai-coding-assistant.html
  - https://thehackernews.com/2025/09/40-npm-packages-compromised-in-supply.html
  - https://cloud.google.com/security/resources/ai-risk-and-resilience-2026
  - https://cloud.google.com/security/resources/ai-risk-and-resilience
  - https://thehackernews.com/2026/08/keyv-linked-npm-worm-poisons-hundreds.html
  - https://thehackernews.com/2026/09/shai-huluds-reach-just-grew-to-469.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-04-26
logsource:
  category: process_creation
  product: linux
  service: auditd
detection:
  selection_node:
    Image|endswith:
      - '/node'
      - '/nodejs'
      - '/bun'
    CommandLine|contains:
      - 'setup_bun.js'
      - 'bundle.js'
  selection_bun:
    Image|endswith:
      - '/bun'
      - '/bunx'
    CommandLine|contains:
      - 'bundle.js'
      - 'oven-sh/bun/releases'
      - 'bun-linux-x64.zip'
  selection_trufflehog:
    Image|endswith:
      - '/trufflehog'
    CommandLine|contains:
      - 'filesystem'
      - 'github'
      - '--json'
  selection_github_api:
    CommandLine|contains:
      - 'api.github.com/user/repos'
      - 'api.github.com/repos'
      - 'shai-hulud'
  selection_download:
    CommandLine|contains:
      - 'bun-linux-x64.zip'
      - 'bun-darwin-x64.zip'
      - 'bun-windows-x64.zip'
      - 'oven-sh/bun/releases/download'
  condition: selection_node or selection_bun or selection_trufflehog or selection_github_api or selection_download
falsepositives:
  - Legitimate use of Bun runtime, TruffleHog, or Node.js scripts named setup_bun.js or bundle.js by developers and CI/CD pipelines.
  - Authorized GitHub API interactions and package publishing during normal development.
  - Security teams running TruffleHog for secret scanning.
  - Whitelist known CI/CD service accounts and approved automation scripts.
level: critical
tags:
  - attack.supply-chain-compromise
  - attack.t1195.002
  - attack.command-and-scripting-interpreter
  - attack.t1059.007
  - attack.credential-access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1567
  - attack.t1567.001
  - attack.ingress-tool-transfer
  - attack.t1105
  - attack.defense-evasion
  - attack.t1027