title: Task#Stomp PowerShell Backdoor Scheduled Task and Credential Theft
id: ""
status: draft
description: Detects PowerShell command lines associated with Task#Stomp backdoor activity, including scheduled task creation, Wi-Fi credential theft, clipboard capture, document collection, and exfiltration.
references:
  - https://thehackernews.com/2026/09/taskstomp-powershell-backdoor-steals.html
  - https://www.securonix.com/blog/task-stomp-powershell-backdoor-document-theft-remote-access
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-05-08
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_schtask:
    CommandLine|contains:
      - 'schtasks'
      - 'Register-ScheduledTask'
      - 'New-ScheduledTask'
      - 'Task#Stomp'
      - 'TaskStomp'
      - 'MicrosoftEdgeUpdate'
  selection_wifi:
    CommandLine|contains:
      - 'netsh wlan show profile'
      - 'netsh wlan show profiles'
      - 'key=clear'
      - 'Get-WiFiProfile'
  selection_clipboard:
    CommandLine|contains:
      - 'Get-Clipboard'
      - 'Set-Clipboard'
      - 'clip.exe'
  selection_document:
    CommandLine|contains:
      - 'Get-ChildItem'
      - 'Compress-Archive'
      - 'Copy-Item'
      - 'Documents'
      - 'Desktop'
      - 'Downloads'
  selection_obfuscation:
    CommandLine|contains:
      - '-enc'
      - '-EncodedCommand'
      - 'FromBase64String'
      - 'IEX'
      - 'Invoke-Expression'
      - 'ExecutionPolicy Bypass'
      - '-nop'
      - '-w hidden'
      - 'WindowStyle Hidden'
  selection_exfil:
    CommandLine|contains:
      - 'api.telegram.org'
      - 'discord.com/api/webhooks'
      - 'pastebin.com'
      - 'transfer.sh'
      - 'anonfiles'
      - 'Invoke-WebRequest'
      - 'DownloadString'
      - 'UploadFile'
      - 'UploadString'
  condition: selection_powershell and (selection_schtask or selection_wifi or selection_clipboard or selection_document) and (selection_obfuscation or selection_exfil)
falsepositives:
  - Legitimate administrative scripts that create scheduled tasks or manage Wi-Fi profiles.
  - Software installers or management tools using PowerShell to collect system information.
  - Authorized clipboard management or backup applications.
  - Signed PowerShell scripts from trusted vendors.
  - Exclusions: filter by known administrative accounts, script hashes, or parent processes.
level: critical
tags:
  - attack.t1059.001
  - attack.t1053.005
  - attack.t1115
  - attack.t1555
  - attack.t1005
  - attack.t1041
  - attack.t1567
  - attack.t1027