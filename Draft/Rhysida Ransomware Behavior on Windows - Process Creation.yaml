title: Rhysida Ransomware Behavior on Windows - Process Creation
id:
status: draft
description: Detects suspicious process executions and command-line arguments associated with Rhysida ransomware activity, including volume shadow copy deletion, recovery-mode disablement, credential dumping, network scanning, PsExec lateral movement, and ransom-note or encrypted-file artifacts. This aligns with Rhysida operations observed in attacks on government networks, including the Berlin state network incident.
references:
  - https://thehackernews.com/2026/08/berlin-refuses-to-pay-hackers-who-stole.html
  - https://www.berlin.de/en/news/10598900-5559700-wegner-and-spranger-berlin-will-not-give.en.html
  - https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1708208.php
  - https://www.ransomware.live/id/QmVybGluLCBHZXJtYW55QHJoeXNpZGE
  - https://thehackernews.com/2023/11/cisa-and-fbi-issue-warning-about.html
  - https://thehackernews.com/2023/08/new-report-exposes-vice-societys.html
  - https://www.berlin.de/rbmskzl/aktuelles/pressemitteilungen/2026/pressemitteilung.1703898.php
  - https://www.berlin.de/aktuelles/10581479-958090-hackerangriff-auf-landesnetz-arbeit-mit-.html
  - https://www.berlin.de/en/news/10587704-5559700-after-hacker-attack-senate-departments-b.en.html
  - https://mediacentre.magairports.com/mag-statement-on-cyber-security-incident/
  - https://www.manchesterairport.co.uk/help/data-security-incident/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-08-04
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_ransom_artifact:
    CommandLine|contains:
      - 'CriticalBreachDetected.pdf'
      - 'ResidualArtifacts.hta'
      - 'Rhysida'
      - '.rhysida'
  selection_shadow_deletion:
    CommandLine|contains|all:
      - 'vssadmin'
      - 'delete shadows'
  selection_wmi_shadow:
    CommandLine|contains|all:
      - 'wmic'
      - 'shadowcopy'
      - 'delete'
  selection_recovery_disable:
    CommandLine|contains|all:
      - 'bcdedit'
      - 'recoveryenabled'
  selection_wipe_free_space:
    CommandLine|contains|all:
      - 'cipher.exe'
      - '/w'
  selection_log_clear:
    CommandLine|contains|all:
      - 'wevtutil'
      - 'cl'
  selection_credential_dump:
    CommandLine|contains:
      - 'sekurlsa::logonpasswords'
      - 'privilege::debug'
      - 'lsass.exe'
      - 'ntds.dit'
      - 'cachedump'
      - 'dpapi::'
      - 'comsvcs.dll'
      - 'MiniDump'
  selection_scanner:
    Image|endswith:
      - '\advanced_ip_scanner.exe'
      - '\netscan.exe'
      - '\nbtscan.exe'
      - '\masscan.exe'
  selection_psexec:
    Image|endswith:
      - '\psexec.exe'
      - '\psexesvc.exe'
      - '\paexec.exe'
  condition: selection_ransom_artifact or selection_shadow_deletion or selection_wmi_shadow or selection_recovery_disable or selection_wipe_free_space or selection_log_clear or selection_credential_dump or selection_scanner or selection_psexec
falsepositives:
  - Legitimate backup and recovery tasks that use vssadmin, bcdedit, cipher, or wevtutil.
  - Approved penetration tests or red-team exercises using Mimikatz, ProcDump, network scanners, or PsExec.
  - Administrative remote management scripts that invoke PsExec or clear event logs as part of normal operations.
level: high
tags:
  - attack.impact
  - attack.t1486
  - attack.t1490
  - attack.credential_access
  - attack.t1003
  - attack.execution
  - attack.t1059.001
  - attack.t1059.003
  - attack.t1047
  - attack.discovery
  - attack.t1018
  - attack.t1046
  - attack.lateral_movement
  - attack.t1021.001
  - attack.defense_evasion
  - attack.t1070.001