title: Replay of Stolen AI/SaaS Session or Application Token Bypassing MFA
id: ""
status: draft
description: Detects successful Okta SSO or session start events that appear to use a replayed stolen session token, application token, or browser cookie from infostealer logs. The suspicious non-interactive user agents and proxy usage may indicate an attacker replaying AI/SaaS tokens to bypass MFA and access AI services without a fresh interactive login.
references:
  - https://thehackernews.com/2026/09/infostealer-logs-expose-replayable-ai.html
  - https://www.okta.com/blog/threat-intelligence/signing_in_without_actually_signing_in
  - https://developer.okta.com/blog/2018/06/20/what-happens-if-your-jwt-is-stolen
  - https://thehackernews.com/2026/04/google-rolls-out-dbsc-in-chrome-146-to.html
  - https://github.com/trufflesecurity/trufflehog
  - https://thehackernews.com/2025/02/microsoft-exposes-llmjacking.html
  - https://www.fortinet.com/blog/threat-research/someone-else-is-using-your-ai
  - https://auth0.com/blog/llmjacking-stolen-api-key-hidden-cost/
  - https://thehackernews.com/2026/08/poison-claude-sells-discounted-claude.html
  - https://thehackernews.com/2026/09/autonomous-ai-agents-compromise.html
author: ""
date: 2026-05-09
logsource:
  category: authentication
  product: okta
  service: okta
detection:
  selection_event:
    eventType:
      - user.authentication.sso
      - user.session.start
    outcome.result: SUCCESS
  selection_suspicious_client:
    client.userAgent.rawUserAgent|contains:
      - 'python'
      - 'curl'
      - 'wget'
      - 'Go-http-client'
      - 'okhttp'
      - 'PostmanRuntime'
      - 'Insomnia'
      - 'axios'
      - 'node-fetch'
      - 'Java/'
      - 'libwww-perl'
      - 'httpclient'
      - 'requests'
  selection_proxy:
    securityContext.isProxy: true
  condition: selection_event and (selection_suspicious_client or selection_proxy)
falsepositives:
  - Legitimate API automation and service accounts using programmatic user agents.
  - Approved integrations, scripts, or monitoring tools that authenticate without interactive MFA.
  - Security and IT automation platforms that use proxies or non-browser clients.
  - Legitimate use of Okta APIs by developers or DevOps tooling.
level: high
tags:
  - attack.credential_access
  - attack.defense_evasion
  - attack.initial_access
  - attack.t1528
  - attack.t1539
  - attack.t1550.001
  - attack.t1078.004
  - attack.t1555.003
  - attack.t1496