title: Suspicious Device Code Authentication to Microsoft Authentication Broker or Office
id: ""
status: draft
description: >-
  Detects successful device code authentication to Microsoft Authentication Broker
  or Microsoft Office applications from a browser user agent. This behavior is
  consistent with EvilTokens device-code phishing campaigns that trick users into
  authenticating a device code to steal Microsoft 365 tokens and compromise inboxes.
references:
  - https://thehackernews.com/2026/09/microsoft-takes-down-eviltokens-device.html
  - https://blogs.microsoft.com/on-the-issues/2026/09/22/disrupting-eviltokens-the-ai-chatbot-built-for-cybercrime/
  - https://www.microsoft.com/en-us/corporate-responsibility/customer-security-trust/digital-crimes-unit/notice-of-pleadings/eviltokens/
  - https://blog.cloudflare.com/threat-intelligence/research/report/cloudflare-participates-in-global-operation-to-disrupt-eviltokens-phishing-as-a-service/
  - https://www.microsoft.com/en-us/security/blog/2026/09/22/unmasking-eviltokens-getting-to-the-root-of-device-code-phishing/
  - https://thehackernews.com/2026/03/device-code-phishing-hits-340-microsoft.html
  - https://www.welivesecurity.com/en/cybercrime/eviltokens-phishing-doesnt-steal-password/
  - https://www.trmlabs.com/resources/blog/trm-labs-supports-microsofts-disruption-of-eviltokens-an-ai-powered-cybercrime-service
  - https://thehackernews.com/2026/07/debull-tooling-abuses-microsoft-device.html
  - https://spycloud.com/blog/disrupting-the-eviltokens-phaas-platform/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-05-09
logsource:
  category: authentication
  product: azure
  service: signinlogs
detection:
  selection:
    AuthenticationProtocol: 'deviceCode'
    OriginalTransferMethod: 'deviceCodeFlow'
    ResultType: '0'
    AppId:
      - '29d9ed98-a469-4536-ade2-f981bc1d605e'  # Microsoft Authentication Broker
      - 'd3590ed6-52b3-4102-aeff-aad2292ab01c'  # Microsoft Office
  selection_browser:
    UserAgent|contains:
      - 'Mozilla'
      - 'Chrome'
      - 'Firefox'
      - 'Safari'
      - 'Edg'
  condition: selection and selection_browser
falsepositives:
  - Legitimate device code authentication by users or automation using Microsoft Authentication Broker or Microsoft Office with a browser-based user agent. Verify with IT and baseline normal device code usage.
  - Legacy or custom applications that may initiate device code flow for these app IDs. Add known users, applications, or IP ranges to an allowlist after validation.
level: high
tags:
  - attack.initial_access
  - attack.t1566.002
  - attack.credential_access
  - attack.t1528
  - attack.t1550.001
  - attack.t1078.004