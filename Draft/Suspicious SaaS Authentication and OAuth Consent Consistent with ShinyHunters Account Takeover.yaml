  - https://thehackernews.com/2026/10/fbi-removes-accenture-contractor-after.html
  - https://www.ic3.gov/PSA/2026/PSA260515
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-10-10
logsource:
  category: authentication
  product: okta
  service: okta.system
detection:
  selection_auth_success:
    eventType: "user.session.start"
    outcome.result: "SUCCESS"
  selection_suspicious_ua:
    client.userAgent.rawUserAgent|contains:
      - "python"
      - "curl"
      - "wget"
      - "PowerShell"
      - "Go-http-client"
      - "okhttp"
      - "python-requests"
      - "libwww-perl"
  selection_proxy:
    securityContext.isProxy: true
  selection_unusual_country:
    client.geographicalContext.country|not in:
      - "US"
      - "CA"
      - "GB"
      - "NL"
      - "JP"
      - "AU"
  selection_oauth_consent:
    eventType: "app.oauth2.as.consent.grant"
  condition: selection_auth_success AND (selection_suspicious_ua OR selection_proxy OR selection_unusual_country) OR selection_oauth_consent
falsepositives:
  - Legitimate administrative scripts or API integrations using scripted user agents.
  - Employees using VPNs or traveling abroad.
  - Authorized security testing or red team activities.
  - OAuth consent granted for approved third-party applications.
level: high
tags:
  - attack.initial_access
  - attack.credential_access
  - attack.valid_accounts
  - attack.mfa_fatigue
  - attack.social_engineering
  - attack.t1078
  - attack.t1621
  - attack.t1586
  - attack.t1528