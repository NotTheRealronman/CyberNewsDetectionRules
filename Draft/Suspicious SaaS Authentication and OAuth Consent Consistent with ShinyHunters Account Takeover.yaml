title: Suspicious SaaS Authentication and OAuth Consent Consistent with ShinyHunters Account Takeover
id: 
status: draft
description: Detects successful authentication to SaaS/SSO platforms (e.g., Okta) from scripted user agents, anonymizing proxies, or unusual geographies, as well as suspicious OAuth consent grants. These patterns are consistent with ShinyHunters TTPs used to compromise the FBI jobs portal and other SaaS applications.
references:
  - https://thehackernews.com/2026/10/fbi-arrests-another-shinyhunters.html
  - https://x.com/FBIDirectorKash/status/2108566367011999780
  - https://thehackernews.com/2026/09/shinyhunters-claims-fbi-breach-says-it.html
  - https://www.nytimes.com/2026/10/09/us/politics/fbi-hack-shinyhunters-arrest.html
  - https://www.cbsnews.com/news/fbi-shinyhunters-arrest-jobs-website-hack/
  - https://www.reuters.com/world/us/fbi-director-patel-says-bureau-has-arrested-another-person-tied-shinyhunters-2026-10-09/
  - https://www.reuters.com/world/middle-east/key-shinyhunters-hacker-detained-jordan-is-cooperating-sources-say-2026-10-03/
  - https://www.thenationalnews.com/news/mena/2026/10/04/jordan-us-hacking/
  - https://thehackernews.com/2026/09/dutch-police-arrest-24-year-old.html
  - https://www.politie.nl/nieuws/2026/september/29/11-verdachte-aangehouden-in-onderzoek-naar-hackersgroep-shinyhunters.html
  - https://www.fbi.gov/video-repository/shinyhunters-arrested-092926.mp4/view
  - https://thehackernews.com/2026/10/shinyhunters-suspect-rey-reportedly.html
