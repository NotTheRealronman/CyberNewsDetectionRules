title: Suspicious Credential Access and Infostealer Activity on Windows Endpoints
id: ''
status: draft
description: >
  Detects post-compromise behavior associated with the identity-centric and
  credential-theft attack chains highlighted in the 2026 cybersecurity landscape
  reporting (infostealer-driven credential harvesting, OS credential dumping,
  and script-based download/execution cradles). Adversaries abuse built-in
  living-off-the-land binaries (rundll32, procdump, powershell) to dump LSASS
  memory, harvest browser-stored secrets, stage payloads, and destroy backup
  recovery options prior to ransomware deployment. Monitoring process creation
  telemetry for these command-line patterns provides early warning of credential
  theft and pre-encryption activity on Windows endpoints.
references:
  - https://thehackernews.com/2026/10/the-state-of-cybersecurity-in-2026key.html
  - https://report.papryon.com/thehackernews
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ''
date: 2026/10/15
logsource:
  category: process_creation
  product: windows
detection:
  selection_lsass_dump_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs.dll'
      - 'MiniDump'
  selection_lsass_dump_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  selection_lsass_dump_ntsd:
    Image|endswith: '\ntsd.exe'
    CommandLine|contains|all:
      - '-c'
      - 'lsass'
  selection_lsass_handle_access:
    CommandLine|contains|all:
      - 'lsass'
      - 'MiniDumpWriteDump'
  selection_browser_credential_theft:
    CommandLine|contains:
      - 'Login Data'
      - 'Local State'
      - 'Web Data'
      - 'cookies.sqlite'
      - 'logins.json'
      - 'key4.db'
      - 'signons.sqlite'
  selection_powershell_download_cradle:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
    CommandLine|contains:
      - 'DownloadString'
      - 'DownloadFile'
      - 'DownloadData'
      - 'Invoke-WebRequest'
      - 'IEX'
      - 'FromBase64String'
      - '-EncodedCommand'
      - 'Net.WebClient'
  selection_archive_staging:
    CommandLine|contains:
      - 'Compress-Archive'
      - 'rar.exe a '
      - '7z.exe a '
      - 'makecab '
  selection_backup_destruction:
    CommandLine|contains:
      - 'vssadmin delete shadows'
      - 'wmic shadowcopy delete'
      - 'wbadmin delete catalog'
      - 'bcdedit /set recoveryenabled no'
      - 'bcdedit /set bootstatuspolicy ignoreallfailures'
  filter_legitimate_backup:
    Image|endswith:
      - '\Veeam.EndPoint.Manager.exe'
      - '\SavService.exe'
      - '\BackupExec.exe'
      - '\NetBackup.exe'
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
  filter_signed_admin_tools:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: '\Windows\Temp\'
  filter_internal_automation:
    ParentImage|endswith:
      - '\CcmExec.exe'
      - '\MsMpEng.exe'
      - '\MonitoringHost.exe'
  condition: 1 of selection_* and not 1 of filter_*
falsepositives:
  - Legitimate administrative or forensic use of procdump/ntsd against lsass by approved incident response teams; exclude by signed tool path and change-ticket correlation.
  - Enterprise backup and monitoring agents (Veeam, Backup Exec, NetBackup, SCOM) that legitimately invoke vssadmin/wbadmin; whitelist by signed image hash and parent process.
  - Software deployment or configuration management platforms (SCCM, Intune, Chef, Ansible) using PowerShell download cradles; whitelist known script repositories and code-signing certificates.
  - IT-team advice: baseline normal credential-access tooling and backup-job schedules, submit known-good parent/child process pairs and command lines for whitelisting, and forward full command-line auditing (Event ID 4688 with command line, Sysmon Event ID 1) plus Sysmon Event ID 10 for lsass handle access to remove blind spots.
level: high
tags:
  - attack.credential-access
  - attack.t1003.001
  - attack.t1003.003
  - attack.t1555.003
  - attack.t1059.001
  - attack.t1105
  - attack.t1112
  - attack.t1490
  - attack.t1562.001
  - attack.impact
  - attack.execution
  - attack.defense-evasion