title: Keycloak Password Reset Abuse - Multiple Distinct Accounts from One Source IP
id:
status: draft
description: >
  Detects an unusual concentration of Keycloak password reset / password update events
  (SEND_RESET_PASSWORD, UPDATE_PASSWORD, RESET_PASSWORD) for multiple distinct user IDs
  originating from the same source IP address within a short timeframe. This behavior is
  consistent with unauthenticated account takeover attempts exploiting CVE-2026-18963 and
  related PII disclosure CVE-2026-17059 in the Keycloak password reset flow.
references:
  - https://thehackernews.com/2026/08/critical-keycloak-password-reset-flaw.html
  - https://access.redhat.com/security/cve/CVE-2026-18963
  - https://escape.tech/blog/escape-research-pii-disclosure-keycloak-cve-2026-17059/
  - https://access.redhat.com/errata/RHSA-2026:56519
  - https://access.redhat.com/errata/RHSA-2026:56520
  - https://access.redhat.com/errata/RHSA-2026:56523
  - https://access.redhat.com/errata/RHSA-2026:56524
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-05-07
logsource:
  category: application
  product: keycloak
  service: authentication
detection:
  selection:
    type|startswith:
      - SEND_RESET_PASSWORD
      - UPDATE_PASSWORD
      - RESET_PASSWORD
  condition: selection | dc(userId) by ipAddress > 5
  timeframe: 10m
fields:
  - ipAddress
  - userId
  - realmId
  - clientId
  - type
falsepositives:
  - Bulk password resets performed by administrators or identity management automation.
  - Multiple users behind a shared NAT/gateway triggering password reset at the same time.
  - Add exclusions for trusted administration IP addresses and service-account client IDs after confirming legitimate business need.
level: high
tags:
  - attack.t1190
  - attack.t1078
  - attack.t1589.002
  - attack.initial_access
  - cve.2026.18963
  - cve.2026.17059