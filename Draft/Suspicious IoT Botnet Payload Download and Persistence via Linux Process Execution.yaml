title: Suspicious IoT Botnet Payload Download and Persistence via Linux Process Execution
id: ""
status: draft
description: Detects suspicious command execution patterns on Linux-based IoT devices that may indicate exploitation and self-propagation by an AI-driven IoT botnet, including download utilities, chmod, and cron persistence.
references:
  - https://thehackernews.com/2026/10/anthropic-warns-small-ai-models-could.html
  - https://www.anthropic.com/research/self-replicating-ai
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-05-09
logsource:
  category: process_creation
  product: linux
detection:
  selection_download:
    Image|endswith:
      - '/wget'
      - '/curl'
      - '/tftp'
      - '/ftp'
      - '/busybox'
    CommandLine|contains:
      - 'wget '
      - 'curl '
      - 'tftp '
      - 'ftp '
      - 'busybox '
  selection_payload:
    CommandLine|contains:
      - '/tmp/'
      - '/var/tmp/'
      - '/dev/shm/'
      - 'chmod +x'
      - 'chmod 777'
      - 'base64 -d'
      - 'python -c'
      - 'perl -e'
  selection_persistence:
    CommandLine|contains:
      - 'crontab'
      - '/etc/cron'
      - 'rc.local'
      - 'systemctl enable'
      - '.bashrc'
      - '.profile'
  selection_scan:
    CommandLine|contains:
      - 'nmap'
      - 'masscan'
      - 'zmap'
      - 'nc -'
      - 'netcat'
      - 'telnet '
      - 'ssh '
  condition: (selection_download and selection_payload) or (selection_persistence and selection_payload) or (selection_scan and selection_download)
falsepositives:
  - Legitimate administrative scripts that download and execute software from the internet
  - Software updates or package management operations
  - Authorized penetration testing or vulnerability scanning
  - Legitimate cron job modifications by system administrators
level: high
tags:
  - attack.t1190
  - attack.t1059.004
  - attack.t1105
  - attack.t1053.003
  - attack.t1110
  - attack.t1595
  - attack.t1021.004