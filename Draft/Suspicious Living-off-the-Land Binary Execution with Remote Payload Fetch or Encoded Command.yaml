title: Suspicious Living-off-the-Land Binary Execution with Remote Payload Fetch or Encoded Command
id:
status: draft
description: >
  Detects abuse of built-in Windows binaries (LOLBins) to fetch remote payloads or execute encoded
  commands. This behavior is aligned with the repeatable living-off-the-land intrusions described in
  Microsoft Digital Defense Report 2025 and Bitdefender threat analyses, where attackers reuse legitimate
  system utilities to establish initial access, load next-stage payloads, and evade endpoint defenses.
references:
  - https://thehackernews.com/2026/09/threat-actors-dont-want-better-attacks.html
  - https://www.microsoft.com/en-us/security/security-insider/threat-landscape/microsoft-digital-defense-report-2025
  - https://www.bitdefender.com/en-us/blog/businessinsights/700000-security-incidents-analyzed-living-off-land-tactics
  - https://www.bitdefender.com/en-us/blog/businessinsights/bitdefender-threat-debrief-july-2026
  - https://www.bitdefender.com/en-us/blog/businessinsights/cybersecurity-predictions-2026-hype-vs-reality
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-09-01
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_lolbin:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\mshta.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\wmic.exe'
      - '\cscript.exe'
      - '\wscript.exe'
      - '\msiexec.exe'
      - '\cmstp.exe'
      - '\msbuild.exe'
      - '\installutil.exe'
  selection_remote:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
      - 'webdav'
      - '\\'
  selection_suspicious:
    CommandLine|contains:
      - '-enc '
      - 'EncodedCommand'
      - 'Invoke-Expression'
      - 'IEX('
      - 'IEX '
      - 'DownloadString'
      - 'DownloadFile'
      - 'FromBase64String'
      - '-urlcache'
      - '/transfer'
      - 'javascript:'
      - 'process call create'
      - '/i:http'
      - 'url.dll'
      - 'RunHTMLApplication'
      - 'mshtml'
  condition: selection_lolbin and (selection_remote or selection_suspicious)
falsepositives:
  - Administrative, patching, or configuration scripts that legitimately use PowerShell or Windows built-in utilities with remote URLs or encoded parameters.
  - Software installers and update automation that invoke msiexec, bitsadmin, or PowerShell to download vendor content.
  - Development and build automation that uses msbuild or PowerShell with private package repositories.
  - Apply exclusions for approved administrative accounts, corporate update servers, and trusted script directories.
level: high
tags:
  - attack.t1059.003
  - attack.t1218.007
  - attack.t1218.010
  - attack.t1218.011
  - attack.t1105
  - attack.t1047
  - attack.t1078
  - attack.t1021
  - attack.t1110
  - attack.t1190
  - attack.t1566
  - lolbins
  - living_off_the_land