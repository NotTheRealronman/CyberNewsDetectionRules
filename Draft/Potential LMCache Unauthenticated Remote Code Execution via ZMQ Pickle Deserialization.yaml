title: "Potential LMCache Unauthenticated Remote Code Execution via ZMQ Pickle Deserialization"
id: ""
status: draft
description: "Detects suspicious child process execution or command-line activity spawned from LMCache/vLLM processes, which may indicate exploitation of CVE-2026-105192. The vulnerability allows unauthenticated attackers to send malicious pickle payloads over the LMCache multiprocess ZMQ transport, leading to arbitrary code execution. Post-exploitation often spawns shells, downloaders, or command interpreters."
references:
  - "https://thehackernews.com/2026/10/unpatched-critical-lmcache-flaw-lets.html"
  - "https://docs.lmcache.ai/mp/index.html"
  - "https://research.jfrog.com/vulnerabilities/lmcache-is-vulnerable-to-unauthenticated-remote-code-execution-via-pickle-deserialization-on-the-multiprocess-zmq-transport-cve-2026-105192-jfsa-2026-001694382/"
  - "https://www.cve.org/CVERecord?id=CVE-2026-105192"
  - "https://github.com/LMCache/LMCache/blob/v0.5.5/examples/multi_process/lmcache-daemonset.yaml"
  - "https://github.com/LMCache/LMCache/blob/v0.5.5/lmcache/v1/platform/base/ipc_wrapper.py"
  - "https://github.com/LMCache/LMCache/security/advisories"
  - "https://github.com/LMCache/LMCache/issues/5507"
  - "https://github.com/LMCache/LMCache/issues/5508"
  - "https://github.com/vllm-project/vllm/security/advisories/GHSA-2823-qmq8-rwvj"
  - "https://thehackernews.com/2025/11/researchers-find-serious-ai-bugs.html"
  - "https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ"
author: ""
date: 2026-10-25
logsource:
  category: process_creation
  product: linux
  service: auditd
detection:
  selection_parent:
    ParentCommandLine|contains:
      - "lmcache"
      - "LMCache"
      - "vllm"
      - "zmq"
      - "multiprocess"
      - "ipc_wrapper"
  selection_child:
    Image|endswith:
      - "/bash"
      - "/sh"
      - "/dash"
      - "/zsh"
      - "/ksh"
      - "/csh"
      - "/tcsh"
      - "/python"
      - "/python3"
      - "/perl"
      - "/ruby"
      - "/php"
      - "/nc"
      - "/ncat"
      - "/netcat"
      - "/socat"
      - "/curl"
      - "/wget"
      - "/chmod"
      - "/chown"
      - "/base64"
      - "/xxd"
      - "/openssl"
      - "/mkfifo"
      - "/telnet"
      - "/ssh"
      - "/scp"
      - "/ftp"
      - "/tftp"
      - "/powershell"
      - "/pwsh"
      - "/cmd"
      - "/cscript"
      - "/wscript"
      - "/mshta"
      - "/rundll32"
      - "/regsvr32"
      - "/certutil"
      - "/bitsadmin"
  selection_cmd:
    CommandLine|contains:
      - "bash -i"
      - "/dev/tcp/"
      - "mkfifo"
      - "nc -e"
      - "ncat -e"
      - "socat"
      - "curl "
      - "wget "
      - "python -c"
      - "python3 -c"
      - "perl -e"
      - "ruby -e"
      - "php -r"
      - "base64 -d"
      - "chmod +x"
      - "sh -c"
      - "os.system"
      - "subprocess"
      - "pty.spawn"
      - "socket"
      - "pickle.loads"
      - "cPickle"
      - "marshal.loads"
      - "eval("
      - "exec("
      - "cos\\nsystem"
      - "cos.system"
      - "__reduce__"
  condition: selection_parent and (selection_child or selection_cmd)
falsepositives:
  - "Legitimate administrative scripts, health checks, or LMCache/vLLM maintenance tasks that spawn shells or command interpreters."
  - "Authorized debugging or profiling tools executed from LMCache/vLLM parent processes."
  - "Whitelist known parent/child process combinations, maintenance windows, and trusted command lines."
level: critical
tags:
  - "attack.initial_access"
  - "attack.t1190"
  - "attack.execution"
  - "attack.t1059"
  - "attack.t1059.004"
  - "attack.t1059.006"
  - "attack.command_and_control"
  - "attack.t1071"
  - "cve.2026-105192"