id: 
status: draft
title: Chrome Google Password Manager Passkey Store Access Attempt
description: Detects command-line access to Chrome user profile files associated with Google Password Manager and passkey storage (Local State, Web Data, Login Data, enclave local state). This activity may indicate malware attempting to collect or decrypt synced passkeys, matching the passkey-hijacking behavior described in attacks against Google Password Manager and Windows CNG unexportable keys.
references:
  - https://thehackernews.com/2026/08/google-password-manager-attacks-could.html
  - https://thehackernews.com/2025/10/how-attackers-bypass-synced-passkeys.html
  - https://unit42.paloaltonetworks.com/passwordless-authentication-security-risks/
  - https://chromium.googlesource.com/chromium/src/crypto/%2B/refs/heads/main/unexportable_key_win.cc
  - https://learn.microsoft.com/en-us/windows/win32/api/ncrypt/nf-ncrypt-ncryptsignhash
  - https://chromium.googlesource.com/chromium/src/%2B/HEAD/chrome/browser/webauthn/proto/enclave_local_state.proto
  - https://chromium.googlesource.com/chromium/src/%2B/HEAD/chrome/browser/webauthn/enclave_manager.cc
  - https://support.google.com/chrome/answer/13168025
  - https://thehackernews.com/2024/09/chrome-users-can-now-sync-passkeys.html
author: 
date: 2026/05/07
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_path:
    EventID: 1
    CommandLine|contains: 'Google\Chrome\User Data'
  selection_file:
    CommandLine|contains:
      - 'Local State'
      - 'Login Data'
      - 'Web Data'
      - 'enclave'
  filter_legitimate_chrome:
    Image|contains:
      - '\Google\Chrome\Application\chrome.exe'
      - '\Google\Chrome Beta\Application\chrome.exe'
      - '\Google\Chrome Dev\Application\chrome.exe'
      - '\Google\Chrome Canary\Application\chrome.exe'
  condition: selection_path and selection_file and not filter_legitimate_chrome
falsepositives:
  - Legitimate backup, migration, synchronization, and browser management utilities that enumerate or copy Chrome profile files.
  - Approved forensic, password recovery, or incident response tooling run by security teams.
  - Genuine Chrome subprocesses are excluded by the filter; add explicit allowlists for trusted administration, backup, and EDR processes.
level: high
tags:
  - attack.credential_access
  - attack.t1555.003
  - attack.collection
  - attack.t1005
  - attack.exfiltration
  - attack.t1041
  - attack.defense_evasion
  - attack.t1055