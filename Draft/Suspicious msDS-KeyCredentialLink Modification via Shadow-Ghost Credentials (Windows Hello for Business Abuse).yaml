title: Suspicious msDS-KeyCredentialLink Modification via Shadow/Ghost Credentials (Windows Hello for Business Abuse)
id:
status: draft
description: >
  Detects modification of the Active Directory attribute msDS-KeyCredentialLink, which is used by
  Windows Hello for Business to store key credentials. CISA red team activity associated with
  CertiGhost and Windows Hello for Business abuse can add rogue key credentials to this attribute,
  allowing adversaries to authenticate as the target account via certificate-based Kerberos
  authentication (Shadow/Ghost Credentials).
references:
  - https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-237a
  - https://thehackernews.com/2026/08/cisa-red-team-compromised-two-critical.html
  - https://thehackernews.com/2026/07/certighost-exploit-lets-low-privileged.html
  - https://thehackernews.com/2026/08/malware-can-abuse-windows-hello-for.html
  - https://thehackernews.com/2026/05/your-purple-team-isnt-purple-its-just.html
author:
date: 2026-05-09
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: msDS-KeyCredentialLink
  condition: selection
falsepositives:
  - Legitimate Windows Hello for Business enrollment and key rotation operations.
  - Authorized device registration and identity lifecycle management via Microsoft Intune or Azure AD Connect.
  - Helpdesk operations that update passwordless credentials on behalf of users.
level: high
tags:
  - attack.credential_access
  - attack.t1649
  - attack.t1098
  - attack.t1550
  - attack.t1556