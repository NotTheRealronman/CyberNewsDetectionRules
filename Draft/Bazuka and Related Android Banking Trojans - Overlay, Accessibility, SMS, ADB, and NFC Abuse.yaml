title: Bazuka and Related Android Banking Trojans - Overlay, Accessibility, SMS, ADB, and NFC Abuse
id: ""
status: draft
description: Detects Android application installation, accessibility-service activation, and related telemetry consistent with Bazuka and related Android fraud frameworks. These families abuse fake screen overlays, accessibility services, SMS access, device administration, ADB, and NFC relay capabilities to steal credentials and control devices.
references:
  - https://thehackernews.com/2026/11/bazuka-android-malware-uses-fake-screen.html
  - https://thehackernews.com/2025/09/raton-android-malware-detected-with-nfc.html
  - https://thehackernews.com/2026/08/windrelay-android-malware-turns-victims.html
  - https://www.threatfabric.com/blogs/bazuka-the-fraud-framework-that-can-do-it-all
  - https://www.virustotal.com/gui/file/f046b50166c8229b49839eeebcc7fd14bf3f198e4ec1bfde8a5b271e1407dec5/details
  - https://thehackernews.com/2026/09/rathat-android-malware-abuses-adb-to.html
  - https://zimperium.com/blog/arcticrat-ai-powered-android-rat
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-11-16
logsource:
  category: mobile
  product: android
  service: edr_telemetry
detection:
  selection_ioc_hash:
    file.hash.sha256:
      - 'f046b50166c8229b49839eeebcc7fd14bf3f198e4ec1bfde8a5b271e1407dec5'
  selection_pkg_family:
    package_name|contains:
      - 'bazuka'
      - 'raton'
      - 'windrelay'
      - 'rathat'
      - 'arcticrat'
  selection_accessibility_overlay:
    permissions|contains|all:
      - 'android.permission.BIND_ACCESSIBILITY_SERVICE'
      - 'android.permission.SYSTEM_ALERT_WINDOW'
    service_name|contains:
      - 'AccessibilityService'
      - 'android.accessibilityservice.AccessibilityService'
    strings|contains:
      - 'TYPE_APPLICATION_OVERLAY'
      - 'TYPE_SYSTEM_ALERT'
      - 'SYSTEM_ALERT_WINDOW'
  selection_credential_sms:
    permissions|contains:
      - 'android.permission.READ_SMS'
      - 'android.permission.RECEIVE_SMS'
      - 'android.permission.READ_PHONE_STATE'
      - 'android.permission.BIND_DEVICE_ADMIN'
      - 'android.permission.REQUEST_INSTALL_PACKAGES'
  selection_adb_abuse:
    command_line|contains:
      - 'pm install'
      - 'settings put secure enabled_accessibility_services'
      - 'appops set'
      - 'adb shell'
  selection_nfc_relay:
    strings|contains:
      - 'HostApduService'
      - 'android.nfc.cardemulation'
      - 'NFC'
      - 'relay'
  filter_legit_system:
    package_name|startswith:
      - 'com.android.'
      - 'com.google.android.'
      - 'com.samsung.android.'
      - 'com.miui.'
      - 'com.sec.android.'
  condition: (selection_ioc_hash or selection_pkg_family or (selection_accessibility_overlay and selection_credential_sms) or selection_adb_abuse or selection_nfc_relay) and not filter_legit_system
falsepositives:
  - Legitimate accessibility, screen-reading, automation, MDM/EDR, and enterprise apps that require accessibility or overlay permissions. Whitelist approved package names, signer certificates, and versions.
  - Developer/test builds and sideloaded apps during authorized testing. Require change tickets and exclude test devices.
  - System OEM apps and keyboard apps with overlay/accessibility capabilities. Validate against known-good app inventory.
level: high
tags:
  - attack.t1417
  - attack.t1411
  - attack.t1453
  - attack.t1434
  - attack.t1471
  - attack.t1512
  - attack.t1513
  - attack.t1409