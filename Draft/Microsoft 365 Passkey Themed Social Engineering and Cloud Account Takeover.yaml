title: Microsoft 365 Passkey Themed Social Engineering and Cloud Account Takeover
id: ""
status: draft
description: |
  Detects suspicious Microsoft 365 / Entra ID audit activity consistent with passkey-themed social engineering, help desk vishing, device code phishing, and cloud account takeover. Attackers may convince users or help desk staff to register attacker-controlled passkeys, FIDO2 security keys, or other authentication methods, reset credentials or MFA, create malicious inbox rules, alter mailbox permissions, or run compliance searches to exfiltrate data.
references:
  - https://thehackernews.com/2026/09/attackers-use-passkey-phishing-to.html
  - https://www.microsoft.com/en-us/security/blog/2026/09/10/protecting-organizations-ai-assisted-executive-impersonation-invoice-fraud/
  - https://www.microsoft.com/en-us/security/blog/2026/09/09/passkey-themed-social-engineering-leads-identity-cloud-compromise/
  - https://thehackernews.com/2026/07/debull-tooling-abuses-microsoft-device.html
  - https://thehackernews.com/2026/08/unc6671-vishing-attacks-target-personal.html
  - https://thehackernews.com/2026/09/microsoft-365-attackers-use-help-desk.html
  - https://thehackernews.com/2026/01/mandiant-finds-shinyhunters-using.html
  - https://learn.microsoft.com/en-us/windows/privacy/windows-11-endpoints-non-enterprise-editions
  - https://learn.microsoft.com/en-us/entra/identity/authentication/howto-authentication-methods-activity
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026/05/09
logsource:
  category: application
  product: m365
  service: audit
detection:
  selection_operation_identity:
    Operation|contains:
      - 'Add passkey'
      - 'Add FIDO2'
      - 'Add security key'
      - 'Add Windows Hello'
      - 'Add Authenticator'
      - 'User registered security info'
      - 'Admin registered security info'
      - 'StrongAuthenticationMethod'
      - 'Update user'
      - 'Reset password'
      - 'Delete strong authentication method'
  selection_operation_exchange:
    Operation|contains:
      - 'New-InboxRule'
      - 'Set-InboxRule'
      - 'UpdateInboxRules'
      - 'Set-Mailbox'
      - 'Add-MailboxPermission'
      - 'Remove-MailboxPermission'
      - 'New-ComplianceSearch'
      - 'Search-Mailbox'
      - 'Set-MailboxJunkEmailConfiguration'
  selection_workload:
    Workload:
      - 'AzureActiveDirectory'
      - 'Exchange'
      - 'SharePoint'
      - 'OneDrive'
      - 'MicrosoftTeams'
  selection_success:
    ResultStatus|contains: 'Success'
  condition: (selection_operation_identity or selection_operation_exchange) and selection_workload and selection_success
fields:
  - Operation
  - Workload
  - UserId
  - ClientIP
  - UserAgent
  - ObjectId
  - ResultStatus
falsepositives:
  - Legitimate user-initiated passkey, FIDO2, Windows Hello, or Authenticator registration during onboarding or device setup.
  - Authorized help desk password resets, MFA method changes, mailbox permission changes, or compliance searches performed by IT administrators.
  - Automated provisioning or identity governance workflows that modify authentication methods or mailbox settings.
  - Legitimate inbox rules created by users or approved business automation.
  - Whitelist known administrative accounts, approved change windows, help desk ticketing systems, and expected user agents or IP ranges.
level: high
tags:
  - attack.initial_access
  - attack.credential_access
  - attack.persistence
  - attack.defense_evasion
  - attack.privilege_escalation
  - attack.exfiltration
