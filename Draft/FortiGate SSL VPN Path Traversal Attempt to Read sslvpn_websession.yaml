title: FortiGate SSL VPN Path Traversal Attempt to Read sslvpn_websession
ID:
status: draft
description: Detects HTTP requests targeting FortiGate SSL VPN portals with path traversal strings associated with FortiBleed/CVE-2018-13379, which can expose sslvpn_websession files and lead to theft of VPN credentials from exposed enterprise firewalls and VPN appliances.
references:
  - "https://thehackernews.com/2026/10/hackers-breach-enterprise-firewalls-and.html"
  - "https://www.group-ib.com/blog/stray-cat-network-edge/"
  - "https://www.vectra.ai/blog/how-attackers-use-shodan-fofa"
  - "https://thehackernews.com/2026/10/fbi-warns-fortibleed-remains-active.html"
  - "https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ"
author:
date: 2026-05-07
logsource:
  category: web
  product: fortinet
  service: fortigate
  definition: FortiGate SSL VPN HTTP access/web logs containing URL, URI, query, source IP, and HTTP method fields.
detection:
  selection_uri:
    url|contains:
      - "/remote/fgt_lang?lang=/"
      - "/dev/cmdb/sslvpn_websession"
      - "sslvpn_websession"
      - "..%2f..%2f..%2f..%2fdev/cmdb/sslvpn_websession"
      - "..%252f..%252f..%252f..%252fdev/cmdb/sslvpn_websession"
  condition: selection_uri
falsepositives:
  - Authorized vulnerability scanning or penetration testing against FortiGate SSL VPN endpoints.
  - Administrative troubleshooting or WAF/proxy test traffic containing path traversal test strings.
  - Security teams validating CVE-2018-13379 exposure should be excluded by approved source IPs or scanner user agents.
level: critical
tags:
  - attack.initial_access
  - attack.t1190
  - attack.credential_access
  - attack.t1552.001
  - attack.discovery
  - attack.t1595
  - attack.t1046
  - attack.t1078