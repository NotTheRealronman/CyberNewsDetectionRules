title: Suspicious Reasoning API Calls Suggesting Chain-of-Thought Extraction
id:
status: draft
description: >
  Detects API requests to OpenAI, Anthropic, or Google Gemini reasoning-model endpoints that show
  signs of protected chain-of-thought extraction. The referenced flaw allows a weaker/auxiliary
  model to decode encrypted reasoning blobs or hidden reasoning tokens exposed through extended
  thinking, thought signatures, logprobs, and redacted thinking blocks. Apply this rule to AI
  gateway/API access logs and tune to known internal usage.
references:
  - https://thehackernews.com/2026/08/openai-anthropic-google-api-flaw-let.html
  - https://arxiv.org/abs/2608.09867
  - https://thehackernews.com/2026/02/anthropic-says-chinese-ai-firms-used-16.html
  - https://developers.openai.com/api/docs/guides/latest-model
  - https://platform.claude.com/docs/en/about-claude/models/extended-thinking-models
  - https://ai.google.dev/gemini-api/docs/thought-signatures
  - https://blog.cryptographyengineering.com/2026/05/29/fooling-around-with-encrypted-reasoning-blobs/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-05-07
logsource:
  category: application
  product: llm
  service: inference
detection:
  selection_endpoint:
    http.method: POST
    http.response.status_code: 200
    http.url.path|contains:
      - '/v1/responses'
      - '/v1/messages'
      - 'generateContent'
      - '/v1/chat/completions'
  selection_reasoning_request:
    http.request.body.content|contains:
      - 'reasoning_effort'
      - 'extended_thinking'
      - 'thinking'
      - 'thought_signatures'
      - 'logprobs'
      - 'budget_tokens'
  selection_reasoning_response:
    http.response.body.content|contains:
      - 'redacted_thinking'
      - 'thought_signature'
      - 'thoughtSignatures'
      - 'encrypted_reasoning'
      - 'reasoning_blob'
      - 'reasoning_tokens'
  filter_known_allowed:
    source.ip|startswith:
      - '10.'
      - '192.168.'
      - '172.16.'
    user_agent.original|contains:
      - 'OpenAI'
      - 'Anthropic'
      - 'Google-API'
      - 'google-generativeai'
  condition: selection_endpoint and (selection_reasoning_request or selection_reasoning_response) and not filter_known_allowed
falsepositives:
  - Legitimate applications that intentionally enable extended thinking/thought signatures for transparent AI features.
  - Developer or QA testing of reasoning APIs, including prompt/debug views that set logprobs or reasoning_effort.
  - Authorized red-team/model evaluation activities; those should use a separate allowlisted API key.
  - Logs that capture request and response bodies may include redacted_thinking/thoughtSignature in normal provider responses; tune by API key and service account.
level: high
tags:
  - attack.t1190
  - atlas.aml-t0026
  - ai.chain_of_thought_extraction
  - ai.model_extraction