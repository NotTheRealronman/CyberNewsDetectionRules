title: Detection of DNS Queries for Potential Typosquatted Domains Imitating Russian Companies
id: 
status: draft
description: >
  Detects DNS queries for domains that are similar to known Russian company domains
  using typosquatting, extra characters, or different TLDs, as observed in a nine-year
  fraud campaign that cloned Russian company websites to steal advance payments.
  This rule leverages common patterns of domain impersonation (e.g., replacing letters,
  adding hyphens, using look-alike top-level domains) to identify suspicious network activity.
references:
  - https://thehackernews.com/2026/07/nine-year-fraud-campaign.html
  - https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjnP2BIJTKZ31v-Y_pyvFqC1s6LD-Bo8UNy3UHgqojpVezgaGWw5-sPe5uRK0dfSm3gmDvoKCdHoJnGx1BiTP6Y0qit7D7TCZU_LckTDpdu9eeyuelmJKndEkOxZP6oNPwzguLBCTkAnNkIEvSYaWamKLqYLrJPjnea1V_lz7UcfQkavBo2g3OEGoLyz7mD/s728-e100/sygnia-d-4.png
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: 
date: 2026-07-29
logsource:
  category: network
  product: dns
  service: query
detection:
  selection:
    # Domains that contain common Russian company names (e.g., gazprom, lukoil, rosneft, sberbank, yandex, mail.ru, vk)
    # with slight modifications: extra characters, missing letters, added hyphens, look-alike TLDs
    dns.question.name|contains:
      - 'gazprom'
      - 'lukoil'
      - 'rosneft'
      - 'sberbank'
      - 'yandex'
      - 'mail.ru'
      - 'vk.com'
  filter:
    # Exclude legitimate domain patterns to reduce false positives
    dns.question.name|endswith:
      - '.ru'            # Legitimate Russian domains (but typosquatted ones may also end with .ru, so need additional checks)
    # Alternatively, use a case-sensitive match for exact known domains
    # This filter is a placeholder – in practice, maintain a whitelist of official domains
    - dns.question.name in (
        'www.gazprom.ru',
        'www.lukoil.ru',
        'www.rosneft.ru',
        'www.sberbank.ru',
        'www.yandex.ru',
        'mail.ru',
        'vk.com'
      )
  condition: selection and not filter
falsepositives:
  - Legitimate subdomains or test domains with similar naming conventions.
  - Internal/honeypot domains designed to catch scanners.
  - Advise IT teams to maintain a whitelist of verified company domains and monitor for newly registered lookalikes.
level: high
tags:
  - attack.t1566.002  # Spearphishing Link
  - attack.t1583.001  # Acquire Infrastructure: Domains
  - attack.t1656      # Impersonation
  - attack.t1584.001  # Compromise Infrastructure: Domains
  - campaign.nine-year-russian-clone-fraud