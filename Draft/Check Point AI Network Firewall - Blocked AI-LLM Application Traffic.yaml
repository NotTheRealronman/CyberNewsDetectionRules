title: Check Point AI Network Firewall - Blocked AI/LLM Application Traffic
id:
status: draft
description: >
  Detects network security events in which a Check Point AI Network Firewall has denied
  traffic related to AI/LLM applications or AI-focused threat signatures. This behavior may
  indicate unauthorized shadow AI usage, prompt injection, AI-generated phishing, or
  attempted data exfiltration to external AI/LLM services.
references:
  - https://thehackernews.com/2026/07/the-network-has-become-control-plane.html
  - https://www.checkpoint.com/solutions/ai-network-firewall/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-04-27
logsource:
  category: firewall
  product: checkpoint
  service: firewall
detection:
  selection_ai_name:
    app_name|re: '(?i)(chatgpt|openai|claude|gemini|copilot|midjourney|dall[- ]?e|llm)'
  selection_ai_cat:
    app_cat|re: '(?i)\b(ai|llm|chatbot|artificial intelligence)\b'
  selection_ai_url:
    url|re: '(?i)(chatgpt\.com|openai\.com|anthropic\.com|claude\.ai|gemini\.google\.com|bard\.google\.com|copilot\.microsoft\.com|aistudio\.google\.com)'
  selection_ai_threat:
    threat_name|re: '(?i)(prompt injection|large language model|llm|ai data exfiltration|ai phishing|generative ai malware)'
  selection_action:
    action|re: '(?i)(drop|block|reject|deny)'
  condition: (selection_ai_name or selection_ai_cat or selection_ai_url or selection_ai_threat) and selection_action
falsepositives:
  - Legitimate internal or security tools that communicate with AI/LLM vendors and are incorrectly blocked by policy.
  - Application and URL categorization misidentifies non-AI domains as AI/LLM services.
  - Sanctioned AI application usage in environments where AI access is normally allowed.
  - IT teams should whitelist known approved AI applications and internal hosts using Check Point App Control rules to reduce false positives.
level: high
tags:
  - attack.t1048
  - attack.t1041
  - attack.t1071
  - attack.exfiltration
  - attack.command_and_control
  - checkpoint
  - ai
  - llm