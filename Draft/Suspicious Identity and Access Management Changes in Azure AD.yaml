title: Suspicious Identity and Access Management Changes in Azure AD
id: ""
status: draft
description: Detects suspicious identity and access management operations in Azure AD audit logs that may indicate account manipulation, privilege escalation, or persistence, as highlighted by identity visibility gaps and Zero Trust principles.
references:
  - https://thehackernews.com/2026/09/identity-visibility-in-2026-foundation.html
  - https://www.orchid.security/guides/cloud-identity-visibility-tools
  - https://csrc.nist.gov/pubs/sp/800/207/final
author: ""
date: 2026-09-15
logsource:
  category: cloud
  product: azure
  service: auditlogs
detection:
  selection:
    OperationName:
      - "Add service principal"
      - "Add owner to application"
      - "Add app role assignment grant to user"
      - "Add member to role"
      - "Add user"
      - "Update user"
      - "Update application"
      - "Update service principal"
      - "Add conditional access policy"
      - "Update conditional access policy"
      - "Add identity provider"
      - "Set domain authentication"
      - "Consent to application"
      - "Add delegated permission grant"
      - "Add certificate to service principal"
      - "Add password to service principal"
  condition: selection
falsepositives:
  - Legitimate administrative activities, automated provisioning, and identity governance tools.
  - IT team should baseline normal admin operations and exclude known service accounts or management IPs.
level: medium
tags:
  - attack.persistence
  - attack.privilege_escalation
  - attack.t1078
  - attack.t1078.004
  - attack.t1098
  - attack.t1526