title: Suspicious Child Process Spawned by PHP or Node.js on Windows
id: ""
status: draft
description: Detects unexpected command interpreters, LOLBins, or suspicious command lines spawned by php.exe, php-cgi.exe, or node.exe on Windows. This activity may indicate exploitation of the Brotli decoder code execution flaw in PHP Windows builds or Node.js, where a crafted Brotli-compressed request causes the runtime process to execute arbitrary commands.
references:
  - "https://thehackernews.com/2026/10/php-issues-second-windows-security.html"
  - "https://thehackernews.com/2026/10/brotli-decoder-flaw-behind-nodejs-rce.html"
  - "https://thehackernews.com/2026/10/php-issues-emergency-patches-for-two.html"
  - "https://downloads.php.net/~windows/releases/archives/php-8.5.12-nts-Win32-vs17-x64.zip.spdx.json"
  - "https://discourse.thephp.foundation/t/announce-updated-php-windows-builds-for-brotli-security-fix/6324"
  - "https://www.php.net/downloads.php?os=windows"
  - "https://curl.se/libcurl/c/CURLOPT_ACCEPT_ENCODING.html"
  - "https://raw.githubusercontent.com/guzzle/guzzle/7.16.1/src/Handler/CurlFactory.php"
  - "https://thehackernews.com/2026/10/researchers-demonstrate-node2shell-rce.html"
  - "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  - "https://thehackernews.com/2026/10/nodejs-brotli-decoder-bug-could-allow.html"
  - "https://docs.guzzlephp.org/en/stable/request-options.html"
  - "https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ"
author: ""
date: 2026/05/09
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_parent:
    ParentImage|endswith:
      - '\php.exe'
      - '\php-cgi.exe'
      - '\node.exe'
  selection_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_lolbin:
    Image|endswith:
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\curl.exe'
      - '\wget.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\whoami.exe'
      - '\systeminfo.exe'
      - '\tasklist.exe'
      - '\schtasks.exe'
      - '\sc.exe'
      - '\wmic.exe'
      - '\cscript.exe'
      - '\wscript.exe'
  selection_cmdline:
    CommandLine|contains:
      - ' -enc'
      - ' -encodedcommand'
      - ' -nop'
      - ' -w hidden'
      - 'IEX'
      - 'Invoke-WebRequest'
      - 'DownloadString'
      - 'http://'
      - 'https://'
      - 'cmd.exe /c'
      - 'powershell'
  condition: selection_parent and (selection_shell or selection_lolbin or selection_cmdline)
falsepositives:
  - Legitimate PHP or Node.js maintenance scripts, Composer scripts, npm lifecycle scripts, build pipelines, or administrative automation that spawn cmd.exe, PowerShell, curl, or other administrative binaries.
  - Exclude known approved parent command lines, script paths, service accounts, and maintenance windows after validating business need.
  - Whitelist signed administrative scripts and restrict PHP/Node.js service accounts from spawning command interpreters where possible.
level: high
tags:
  - attack.initial_access
  - attack.execution
  - attack.t1190
  - attack.t1203
  - attack.t1059.001
  - attack.t1059.003
  - attack.t1105