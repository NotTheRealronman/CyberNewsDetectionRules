title: Cosmos EVM GHSA-7g4w-cg88-2cq2 Crafted Transaction Panic Detection
id: 
status: draft
description: >-
  Detects Go runtime panic/fatal messages in Cosmos EVM module logs consistent
  with exploitation of GHSA-7g4w-cg88-2cq2. A crafted EVM transaction can trigger
  an unhandled panic in the Cosmos EVM state transition, potentially halting the
  chain. This rule looks for the panic signature in node logs from vulnerable
  Cosmos EVM deployments (versions before v0.7.2).
references:
  - https://thehackernews.com/2026/08/cosmos-evm-flaw-exploited-after-cosmos.html
  - https://github.com/cosmos/security/blob/main/communications/cosmos_evm_GHSA-7g4w-cg88-2cq2_post_mortem.md
  - https://github.com/cosmos/evm/security/advisories/GHSA-7g4w-cg88-2cq2
  - https://github.com/cosmos/evm/pull/1176
  - https://github.com/cosmos/evm/commit/3524ebc6f3990fd3cc6243375fc070d8f2efabc1
  - https://github.com/zeta-chain/evm/pull/31
  - https://github.com/cosmos/evm/releases/tag/v0.7.2
  - https://docs.cosmos.network/sdk/latest/security/bug-bounty
author: 
date: 2026/05/07
logsource:
  category: application
  product: cosmos
  service: evm
detection:
  selection:
    - "log.level": ["error", "fatal", "critical"]
      "log.logger|contains": "evm"
      "log.message|contains|all":
        - "panic"
        - "runtime error"
    - "level": ["error", "fatal", "critical"]
      "module|contains": "evm"
      "message|contains|all":
        - "panic"
        - "runtime error"
    - "level": ["error", "fatal", "critical"]
      "message|contains|all":
        - "cosmos/evm"
        - "panic"
  condition: selection
falsepositives:
  - Node restarts or chain upgrades that intentionally recover from a panic while testing the EVM module.
  - Fuzzed or malformed test transactions sent to non-production chains by developers.
  - Legitimate EVM execution failures that include the same Go panic text; whitelist known test accounts and confirm the node is patched to v0.7.2 or later.
level: critical
tags:
  - attack.t1190
  - attack.t1499.004