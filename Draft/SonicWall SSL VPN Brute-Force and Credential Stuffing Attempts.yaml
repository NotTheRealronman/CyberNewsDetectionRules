title: SonicWall SSL VPN Brute-Force and Credential Stuffing Attempts
id:
status: draft
description: Detects multiple failed SSL VPN authentication events from a single external IP address against SonicWall SMA devices. This behavior aligns with active SonicWall attack activity reported in the ThreatsDay roundup, where attackers target internet-facing SSL VPN portals for credential guessing, password spraying, and subsequent unauthorized access.
references:
  - https://thehackernews.com/2026/07/threatsday-ai-powered-hacking-370.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026/05/12
logsource:
  category: firewall
  product: sonicwall
  service: sslvpn
detection:
  selection:
    keywords:
      - "SSL VPN login failed"
      - "SSL VPN authentication failed"
      - "SSLVPN_LOGIN_FAILED"
  timeframe: 5m
  condition: selection | count() by src_ip > 5
falsepositives:
  - Legitimate users with multiple failed password attempts during password resets or MFA push rejections.
  - Automated availability or configuration-health checks that intentionally attempt failed VPN logins.
  - Shared public IP addresses where multiple users are failing VPN authentication.
  - Exclude known administrative jump hosts and trusted source IPs using local allowlists.
level: high
tags:
  - attack.t1110
  - attack.t1110.001
  - attack.t1078
  - attack.t1133