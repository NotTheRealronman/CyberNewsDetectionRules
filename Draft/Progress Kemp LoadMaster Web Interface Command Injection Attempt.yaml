title: Progress Kemp LoadMaster Web Interface Command Injection Attempt
id: ""
status: draft
description: Detects HTTP requests to the Progress Kemp LoadMaster web management interface containing command injection metacharacters or encoded payloads. This is intended to identify exploitation attempts related to the CISA KEV-listed Kemp LoadMaster command injection vulnerability, including the reported active exploitation attempts.
references:
  - https://thehackernews.com/2026/08/progress-kemp-loadmaster-flaw-hits-cisa.html
  - https://www.cisa.gov/news-events/alerts/2026/08/07/cisa-adds-one-known-exploited-vulnerability-catalog
  - https://thehackernews.com/2026/07/latest-progress-kemp-loadmaster-pre.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-08-08
logsource:
  category: webserver
  product: kemp_loadmaster
  service: web_ui
detection:
  selection_query:
    cs-uri-query|re: '(?i)(;|\||`|\$\(|\$\{|%0a|%0d|%3b|%7c|%24%28)'
  selection_body:
    cs-body|re: '(?i)(;|\||`|\$\(|\$\{|%0a|%0d|%3b|%7c|%24%28)'
  condition: selection_query or selection_body
falsepositives:
  - Legitimate administrative diagnostic requests containing semicolons or pipes in parameters.
  - Authorized security scanner traffic that intentionally sends command injection strings for vulnerability assessment.
  - If applications use semicolons as a parameter separator, allowlist trusted source IPs or specific administrative URLs.
level: high
tags:
  - attack.t1190
  - attack.t1059.004
  - cisa.kev
  - progress.kemp.loadmaster
  - command.injection