title: Suspicious Azure AD OAuth Consent Grant with High-Risk Graph Permissions
id:
status: draft
description: >
  Detects Azure AD/Microsoft 365 audit events in which a user or administrator consents to an
  OAuth application requesting offline_access together with high-risk Microsoft Graph permissions.
  This behavior is consistent with CEO phishing-kit campaigns, Dropbox-related third-party OAuth
  account abuse, and OAuth trap phishing activity where victims are lured into granting persistent
  access to mail, files, directories, or cloud resources.
references:
  - 'https://thehackernews.com/2026/09/threatsday-ceo-phishing-kits-5k-dropbox.html'
  - 'https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ'
author:
date: 2026/09/26
logsource:
  category: application
  product: azure
  service: auditlogs
detection:
  selection_operation_1:
    Operation|startswith:
      - 'Consent to application'
      - 'Add OAuth2PermissionGrant'
      - 'Add delegated permission grant'
  selection_operation_2:
    OperationName|startswith:
      - 'Consent to application'
      - 'Add OAuth2PermissionGrant'
      - 'Add delegated permission grant'
  selection_result_1:
    ResultStatus|contains: 'Success'
  selection_result_2:
    ResultType|contains:
      - 'Success'
      - 'success'
  selection_result_3:
    Result|contains:
      - 'success'
      - 'succeeded'
  selection_offline_1:
    TargetResources|contains: 'offline_access'
  selection_offline_2:
    AuditData|contains: 'offline_access'
  selection_highrisk_1:
    TargetResources|contains:
      - 'Mail.Read'
      - 'Mail.Send'
      - 'Files.ReadWrite.All'
      - 'Directory.ReadWrite.All'
      - 'User.ReadWrite.All'
  selection_highrisk_2:
    AuditData|contains:
      - 'Mail.Read'
      - 'Mail.Send'
      - 'Files.ReadWrite.All'
      - 'Directory.ReadWrite.All'
      - 'User.ReadWrite.All'
  condition: (selection_operation_1 or selection_operation_2) and (selection_result_1 or selection_result_2 or selection_result_3) and (selection_offline_1 or selection_offline_2) and (selection_highrisk_1 or selection_highrisk_2)
falsepositives:
  - Legitimate third-party SaaS applications approved by the organization that require offline access to Microsoft Graph.
  - Verified-publisher enterprise applications already reviewed and allowed by the security team.
  - Administrator tenant-wide consent grants to trusted applications with the same permission sets.
level: high
tags:
  - attack.credential_access
  - attack.persistence
  - attack.t1078.004
  - attack.t1528
  - attack.t1550.001
  - attack.t1566.002