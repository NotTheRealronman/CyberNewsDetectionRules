title: Suspicious MFA Push Fatigue Against Okta SSO by ShinyHunters/Scattered Spider
id: 
status: draft
description: Detects multiple failed MFA push attempts for the same user within a short time window, indicative of MFA fatigue attacks used by ShinyHunters/Scattered Spider to bypass multi-factor authentication and gain unauthorized access to SaaS applications.
