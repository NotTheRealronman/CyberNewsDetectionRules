author: 
date: 2026-05-22
logsource:
  category: authentication
  product: okta
  service: sso
detection:
  selection:
    eventType: 'user.authentication.auth_via_mfa'
    outcome.result: 'FAILURE'
  condition: selection | count() by actor.alternateId > 5
  timeframe: 5m
falsepositives:
  - Legitimate users repeatedly failing MFA due to forgotten device or network issues.
  - Service accounts or automated processes with misconfigured MFA.
  - Security awareness training causing multiple MFA push denials.
  - IT help desk assisting users with MFA reset.
level: high
tags:
  - attack.credential_access
  - attack.defense_evasion
  - attack.t1621
  - attack.t1078
  - attack.t1566