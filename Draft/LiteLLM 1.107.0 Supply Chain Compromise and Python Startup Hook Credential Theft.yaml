title: LiteLLM 1.107.0 Supply Chain Compromise and Python Startup Hook Credential Theft
id: ""
status: draft
description: Detects installation or execution of the malicious LiteLLM 1.107.0 Python package and related Python startup-hook persistence and credential-theft activity. The compromised wheel is reported to use .pth, sitecustomize, or usercustomize startup hooks to persist and steal GitHub, PyPI, cloud, SSH, Kubernetes, Docker, and LiteLLM master-key credentials, enabling release-pipeline hijacking.
references:
  - https://thehackernews.com/2026/10/leaked-litellm-master-key-let-attackers.html
  - https://thehackernews.com/2026/10/litellm-suspects-github-token-leak-in.html
  - https://github.com/LiteLLM-Labs/lite-harness/blob/e10b14a/harnesses/opencode/opencode.json
  - https://github.com/BerriAI/litellm/issues/47826#issuecomment-6374891275
  - https://thehackernews.com/2026/10/litellm-compromised-in-supply-chain.html
  - https://opensourcemalware.com/blog/litellm-1-107-0-pypi-wheel-contains-a-credential-stealer-and-persistent-python-backdoor
  - https://www.microsoft.com/en-us/security/blog/2026/10/23/inside-the-litellm-1-107-0-supply-chain-compromise-credential-theft-through-python-startup-hooks/
author: ""
date: 2026/05/07
logsource:
  category: process_creation
  product: linux
detection:
  selection_litellm_install:
    Image|endswith:
      - '/pip'
      - '/pip3'
      - '/python'
      - '/python3'
      - '/python3.11'
      - '/python3.12'
    CommandLine|contains|all:
      - 'install'
      - 'litellm'
      - '1.107.0'
  selection_litellm_wheel:
    CommandLine|contains:
      - 'litellm==1.107.0'
      - 'litellm-1.107.0'
      - 'litellm-1.107.0-py3-none-any.whl'
  selection_python_startup_hook:
    CommandLine|contains:
      - '.pth'
      - 'sitecustomize'
      - 'usercustomize'
  selection_credential_access:
    CommandLine|contains:
      - '.git-credentials'
      - '.config/gh/hosts.yml'
      - '.npmrc'
      - '.pypirc'
      - '.aws/credentials'
      - '.config/gcloud'
      - '.azure'
      - '.ssh/id_rsa'
      - '.ssh/id_ed25519'
      - '.kube/config'
      - '.docker/config.json'
      - 'GITHUB_TOKEN'
      - 'GH_TOKEN'
      - 'PYPI_TOKEN'
      - 'TWINE_PASSWORD'
      - 'AWS_ACCESS_KEY_ID'
      - 'AWS_SECRET_ACCESS_KEY'
      - 'AWS_SESSION_TOKEN'
      - 'AZURE_CLIENT_SECRET'
      - 'GOOGLE_APPLICATION_CREDENTIALS'
      - 'LITELLM_MASTER_KEY'
  selection_release_pipeline:
    CommandLine|contains:
      - 'gh release create'
      - 'gh workflow run'
      - 'workflow_dispatch'
      - 'git tag'
      - 'git push'
  condition: selection_litellm_install or selection_litellm_wheel or (selection_python_startup_hook and selection_credential_access) or (selection_credential_access and selection_release_pipeline)
fields:
  - CommandLine
  - Image
  - ParentCommandLine
  - User
falsepositives:
  - Legitimate installation of LiteLLM 1.107.0 for testing, rollback, or development; verify package source, hash, and approval.
  - Legitimate Python packages that create or load .pth, sitecustomize.py, or usercustomize.py startup hooks; allowlist approved packages and administrative scripts.
  - CI/CD release automation that legitimately references GitHub, PyPI, AWS, Azure, GCP, SSH, Kubernetes, Docker, or LiteLLM tokens; restrict secrets to protected environment variables and allowlist approved pipelines.
  - Administrative scripts that access credential files or perform git/gh release operations; require change tickets and approved service accounts.
level: high
tags:
  - attack.initial_access
  - attack.t1195.001
  - attack.t1195.002
  - attack.persistence
  - attack.t1546.018
  - attack.credential_access
  - attack.t1552.001
  - attack.t1528
  - attack.collection
  - attack.t1005
  - attack.exfiltration
  - attack.t1078
  - attack.t1078.004