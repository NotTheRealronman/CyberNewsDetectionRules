title: "APT29 CaptiveCrunch Fake Browser Update and Credential Theft via Browser-Spawned Script Host"
id: ""
status: draft
description: >
  Detects the execution of script runners spawned from web browser processes with command lines
  referencing remote downloads, encoded PowerShell, or browser credential store paths. This behavior
  is consistent with APT29/Midnight Blizzard's CaptiveCrunch campaign, in which hotel/captive-portal
  Wi-Fi is hijacked, DNS is poisoned, and travellers are served fake browser update pages that deliver
  surveillance/credential-theft malware. The rule focuses on the malicious payload execution phase and
  on attempts to access Chrome/Edge profile data such as Cookies and Login Data.
references:
  - https://thehackernews.com/2026/08/hijacked-hotel-wi-fi-pushes-fake.html
  - https://thehackernews.com/2026/06/clickfix-campaigns-expand-malware.html
  - https://thehackernews.com/2025/08/amazon-disrupts-apt29-watering-hole.html
  - https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/
  - https://thehackernews.com/2024/08/google-chrome-adds-app-bound-encryption.html
  - https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/
  - https://thehackernews.com/2026/04/russian-state-linked-apt28-exploits.html
  - https://www.ncsc.gov.uk/news/svr-cyber-actors-adapt-tactics-for-initial-cloud-access
author: ""
date: 2026-05-07
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_parent:
    ParentImage|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
      - '\iexplore.exe'
      - '\brave.exe'
      - '\opera.exe'
  selection_child:
    Image|endswith:
      - '\mshta.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\cmd.exe'
      - '\rundll32.exe'
  selection_remote:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'DownloadString'
      - 'Invoke-Expression'
      - 'Invoke-WebRequest'
      - 'IEX('
      - 'FromBase64String'
      - '-EncodedCommand'
      - 'certutil'
      - 'bitsadmin'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - '.hta'
      - '.ps1'
  selection_cred:
    CommandLine|contains:
      - 'Login Data'
      - 'Cookies'
      - 'Web Data'
      - 'User Data\Default'
  condition: (selection_parent and selection_child and selection_remote) or (selection_child and selection_cred)
falsepositives:
  - Enterprise software distribution or update tools that launch PowerShell/HTA from a browser-like helper process; validate signed binaries and known internal update servers.
  - Browser password recovery or migration utilities may access cookie/login data; add allowlists for approved administration tools and support workflows.
  - Anomalous but legitimate browser integration tests may invoke cmd/powershell; enrich with user context and network destination.
level: high
tags:
  - attack.t1189
  - attack.t1059.001
  - attack.t1204.002
  - attack.t1218.005
  - attack.t1071.001
  - attack.t1105
  - attack.t1555.003
  - attack.t1113