title: Suspicious Kaltura mwEmbed File Read or Remote Code Execution Attempt
id: ""
status: draft
description: >
  Detects HTTP requests targeting Kaltura mwEmbed or Kaltura API endpoints that
  contain common PHP stream wrappers, path traversal, serialized PHP object,
  or XXE markers. These patterns are associated with the disclosed Kaltura
  mwEmbed flaws described in "One Parameter, Two Bugs", which can allow a remote
  attacker to read local files and possibly execute arbitrary code on the affected
  Kaltura server.
references:
  - https://thehackernews.com/2026/08/unpatched-kaltura-mwembed-flaws-could.html
  - https://anddone-git.github.io/2026/one-parameter-two-bugs/
  - https://thehackernews.com/2026/04/nist-limits-cve-enrichment-after-263.html
  - https://github.com/kaltura/server/commit/6a6d14328b7a1493e8c47f9565461e5f88be20c9
  - https://thehackernews.com/2026/07/fastjson-1x-rce-vulnerability-targeted.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-08-04
logsource:
  category: webserver
  product: kaltura
  service: http
detection:
  selection_mwembed:
    cs-uri-stem|contains:
      - "mwEmbed"
  selection_api:
    cs-uri-stem|contains:
      - "/api_v3/index.php"
  selection_api_generic:
    cs-uri-stem|endswith:
      - "index.php"
    cs-uri-query|contains:
      - "service="
  selection_suspicious:
    cs-uri-query|contains:
      - "php://"
      - "phar://"
      - "zip://"
      - "expect://"
      - "data://"
      - "file://"
      - "../"
      - "..%2f"
      - "..%2F"
      - "..%252f"
      - "..%252F"
      - "..%c0%af"
      - "..%C0%AF"
      - "%2e%2e%2f"
      - "%2E%2E%2F"
      - "%2e%2e%5c"
      - "..\\"
      - "....//"
      - "etc/passwd"
      - "etc/shadow"
      - "proc/self/environ"
      - "O:"
      - "O%3A"
      - "<!DOCTYPE"
      - "%3C!DOCTYPE"
      - "%3C%21DOCTYPE"
      - "%3c%21doctype"
      - "!ENTITY"
  condition: (selection_mwembed or selection_api or selection_api_generic) and selection_suspicious
falsepositives:
  - Vulnerability scanners and automated internet probes may generate similar requests.
  - Legitimate Kaltura player integrations that accept user-supplied URLs or configuration values should be baselined and allowlisted.
  - CDN, load balancer, or health check traffic may contain encoded slashes and should be excluded after verification.
level: critical
tags:
  - attack.t1190
  - attack.t1059
  - attack.t1005
  - attack.t1083
  - cwe-22
  - cwe-502
  - kaltura.mwembed
  - local-file-inclusion
  - remote-code-execution