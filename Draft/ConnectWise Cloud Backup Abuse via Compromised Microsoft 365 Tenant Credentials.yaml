title: ConnectWise Cloud Backup Abuse via Compromised Microsoft 365 Tenant Credentials
id: ''
status: draft
description: Detects suspicious Microsoft 365 Unified Audit Log activity consistent with attackers using compromised vendor or tenant credentials to access Microsoft 365 tenants, manipulate OAuth/service principal permissions, alter mailboxes, and access or download data associated with ConnectWise Cloud Backup.
references:
  - 'https://thehackernews.com/2026/10/connectwise-suspends-cloud-backup-after.html'
  - 'https://www.connectwise.com/company/trust/advisories'
  - 'https://thehackernews.com/2026/10/hackers-use-compromised-connectwise.html'
  - 'https://status.connectwise.com/pages/incident/619cf82551fec9053d612f09/6ad263692dc48705ab3da2cb'
  - 'https://www.huntress.com/blog/vendor-credential-enables-unauthorized-access'
  - 'https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ'
author: ''
date: 2026/05/07
logsource:
  category: cloud
  product: m365
  service: audit
definition: 'Requires ingestion of Microsoft 365 Unified Audit Log events. Baseline approved ConnectWise Cloud Backup application IDs, service accounts, administrative IP ranges, and consent/change windows before production use.'
detection:
  selection_connectwise_app:
    ApplicationDisplayName|contains:
      - 'ConnectWise'
      - 'Cloud Backup'
  selection_connectwise_ua:
    UserAgent|contains:
      - 'ConnectWise'
      - 'Cloud Backup'
  selection_connectwise_target:
    Target|contains:
      - 'ConnectWise'
      - 'Cloud Backup'
  selection_connectwise_params:
    Parameters|contains:
      - 'ConnectWise'
      - 'Cloud Backup'
  selection_high_risk_operations:
    Operation:
      - 'Add service principal'
      - 'Add OAuth2PermissionGrant'
      - 'Add delegated permission grant'
      - 'Consent to application'
      - 'Add app role assignment grant to user'
      - 'Add member to role'
      - 'Update application'
      - 'Set-OrganizationConfig'
      - 'New-InboxRule'
      - 'Set-InboxRule'
      - 'Add-MailboxPermission'
      - 'Set-Mailbox'
      - 'MailItemsAccessed'
      - 'FileDownloaded'
      - 'FileSyncDownloadedFull'
  selection_suspicious_useragent:
    UserAgent|contains:
      - 'PowerShell'
      - 'Invoke-WebRequest'
      - 'python-requests'
      - 'curl'
      - 'wget'
      - 'Go-http-client'
  condition: (selection_connectwise_app or selection_connectwise_ua or selection_connectwise_target or selection_connectwise_params) and selection_high_risk_operations or (selection_high_risk_operations and selection_suspicious_useragent)
falsepositives:
  - Legitimate ConnectWise Cloud Backup service principals, applications, or service accounts performing approved backup, restore, consent, or mailbox operations.
  - Authorized Microsoft 365 administrators adding OAuth applications, service principals, role assignments, or mailbox permissions during approved change windows.
  - Automated backup, migration, or administrative scripts using PowerShell, curl, wget, or similar user agents from approved administrative hosts or IP ranges.
  - Known ConnectWise integration IP addresses or application IDs that have been baselined and allowlisted by the IT team.
level: high
tags:
  - attack.initial_access
  - attack.t1078
  - attack.t1078.004
  - attack.credential_access
  - attack.t1528
  - attack.persistence
  - attack.t1098
  - attack.defense_evasion
  - attack.t1556
  - attack.collection
  - attack.t1114
  - attack.exfiltration
  - attack.t1567