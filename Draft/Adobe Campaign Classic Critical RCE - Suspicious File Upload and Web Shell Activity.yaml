title: Adobe Campaign Classic Critical RCE - Suspicious File Upload and Web Shell Activity
id:
status: draft
description: >
  Detects attempts to exploit the critical Adobe Campaign Classic remote code execution
  vulnerability addressed in APSB26-114. The rule focuses on unauthenticated or suspicious
  PUT/POST requests to Campaign Classic upload endpoints with JSP, JSPX, or WAR file
  extensions, as well as access to uploaded JSP web shells with command execution keywords.
references:
  - https://thehackernews.com/2026/08/adobe-campaign-classic-cvss-100-flaw.html
  - https://helpx.adobe.com/security/products/campaign/apsb26-114.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-08-14
logsource:
  category: webserver
  product: adobe_campaign_classic
  service: http
detection:
  selection_upload:
    cs-method:
      - 'POST'
      - 'PUT'
    cs-uri-path|contains:
      - '/upload.jsp'
      - '/nl/upload.jsp'
      - '/jsp/upload.jsp'
      - '/campaign/upload.jsp'
      - '/FileUpload'
      - '/UploadServlet'
    cs-uri-extension|lowercase|endswith:
      - '.jsp'
      - '.jspx'
      - '.war'
  selection_upload_query:
    cs-uri-query|re:
      - '(?i)(filename|file|fileName)=.*\.(jsp|jspx|war)'
  selection_webshell:
    cs-uri-extension|lowercase|endswith:
      - '.jsp'
      - '.jspx'
    cs-uri-query|contains:
      - 'cmd='
      - 'whoami'
      - 'exec='
      - 'powershell'
      - 'Runtime.getRuntime'
      - 'ProcessBuilder'
      - 'base64'
  condition: selection_upload or selection_upload_query or selection_webshell
falsepositives:
  - Legitimate file imports or uploads performed by authorized Adobe Campaign Classic administrators.
  - Vulnerability scanners, penetration tests, and other security assessment activity.
  - Internal web applications that use Campaign Classic upload endpoints for approved extensions.
  - If triggered, validate the source IP address, authenticated session, and whether a new JSP/WAR file was created under the Campaign web root.
level: critical
tags:
  - attack.t1190
  - attack.t1059
  - attack.t1505.003
  - apsb26-114
  - adobe-campaign-classic
  - rce
  - webshell