title: Tengu Botnet Watchdog Timer Persistence Detection
id: 
status: draft
description: Detects kernel watchdog timeout or reset events that may indicate the Tengu botnet's persistence mechanism, which forces a system reboot after the botnet process is killed.
references:
  - https://thehackernews.com/2026/07/tengu-botnet-reboots-compromised-linux.html
  - https://www.nozominetworks.com/blog/tengu-a-modernized-mirai-that-doesnt-want-to-leave
author: 
date: 2025-04-08
logsource:
  category: syslog
  product: linux
  service: kernel
detection:
  selection:
    - 'watchdog: watchdog0: resetting'
    - 'watchdog: watchdog0: timeout'
    - 'watchdog: watchdog0: .* timeout'
    - 'watchdog: watchdog0: triggered'
  condition: selection
falsepositives:
  - Legitimate watchdog daemon processes (e.g., wd_keepalive, watchdog)
  - Hardware watchdog tests performed by administrators
  - Kernel watchdog behavior during power management events
  - Systems with intentional watchdog configuration for high-availability
level: high
tags:
  - attack.t1529
  - attack.t1547
  - attack.t1060
  - tengu
  - botnet
  - persistence
  - linux