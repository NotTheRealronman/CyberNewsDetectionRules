title: Credential Dumping via LSASS Memory Access Attempt
id:
status: draft
description: Detects attempts to dump LSASS process memory using common post-exploitation and credential access tools. This behavior aligns with the “collapsed inside” stage of the reported intrusion narrative, where an attacker who bypasses or evades edge defenses obtains credentials on an internal Windows host and attempts to move laterally.
references:
  - https://thehackernews.com/2026/08/enterprise-defenses-recovered-at-edge.html
  - https://hubs.li/Q04s3wdR0
  - https://www.picussecurity.com/platform/autonomous-penetration-testing
  - https://www.linkedin.com/in/silaozeren/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author:
date: 2026-05-07
logsource:
  category: process_creation
  product: windows
  service: security
detection:
  selection_eventid:
    EventID: 4688
  selection_procdump:
    NewProcessName|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains|all:
      - '-ma'
      - 'lsass'
  selection_comsvcs:
    NewProcessName|endswith: '\rundll32.exe'
    CommandLine|contains|all:
      - 'comsvcs.dll'
      - 'MiniDump'
  selection_mimikatz:
    NewProcessName|endswith: '\mimikatz.exe'
    CommandLine|contains: 'sekurlsa::logonpasswords'
  condition: selection_eventid and 1 of selection_*
falsepositives:
  - Legitimate administrative or forensic activity using ProcDump, Mimikatz, or comsvcs.dll for troubleshooting and incident response.
  - Trusted endpoint monitoring tools that query or inspect LSASS memory as part of normal security telemetry.
  - Include explicit allowlists for known administration hosts, service accounts, and legitimate response tools where approved.
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.execution
  - attack.t1059.001
  - attack.defense_evasion
  - attack.t1078
  - attack.lateral_movement
  - attack.t1021.001
  - attack.initial_access
  - attack.t1133