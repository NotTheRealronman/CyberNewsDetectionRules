title: Suspicious OAuth Consent Grant to AI Assistant Application
id: ""
status: draft
description: Detects OAuth consent grants to third-party AI assistant applications (e.g., ChatGPT, Claude, Gemini, Copilot) in Microsoft 365 audit logs. This indicates potential shadow AI or Bring Your Own Agent (BYOA) activity where employees grant AI agents access to corporate data, which can be abused by attackers to exfiltrate sensitive information.
references:
  - https://thehackernews.com/2026/10/bring-your-own-agent-your-employees.html
  - https://techrepublic.com/article/news-amazon-blocks-meta-muse
  - https://www.scworld.com/brief/instinct-ai-assistant-faces-privacy-concerns-amid-praise
  - https://www.token.security/book-a-demo?utm_source=thehackernews&utm_medium=3rdparty&utm_campaign=thehackernews&utm_content=oct-12
author: ""
date: 2026-10-12
logsource:
  category: application
  product: m365
  service: audit
detection:
  selection_event:
    Operation: "Consent to application."
  selection_ai_app:
    ApplicationName|contains:
      - "ChatGPT"
      - "OpenAI"
      - "Claude"
      - "Anthropic"
      - "Gemini"
      - "Bard"
      - "Copilot"
      - "Meta AI"
      - "Muse"
      - "Instinct"
      - "Perplexity"
      - "Character.AI"
      - "AI Assistant"
      - "AI Agent"
  condition: selection_event and selection_ai_app
falsepositives:
  - Legitimate use of approved AI assistants by employees. Verify with IT security team and business owner.
  - Employees testing new AI tools for business purposes. Whitelist approved application IDs.
level: high
tags:
  - attack.initial_access
  - attack.credential_access
  - attack.persistence
  - attack.collection
  - attack.exfiltration
  - attack.t1528
  - attack.t1550.001
  - attack.t1078.004
  - attack.t1098
  - attack.t1136.003
  - attack.t1567
  - attack.t1114
  - attack.t1530
  - attack.t1213
  - attack.t1199