title: Suspicious Third-Party AI Agent OAuth Consent or Service Principal Creation in Microsoft 365
id: 
status: draft
description: Detects creation or consent of third-party AI agents, service principals, or OAuth applications in Microsoft 365 that may indicate unmanaged/shadow AI agent activity. The Third-Party Agent Problem article highlights that security controls often miss agents not explicitly chosen by the organization. Monitoring M365 audit logs for AI-related application names and OAuth consent events can reveal unauthorized third-party agents gaining access to tenant data.
references:
  - https://thehackernews.com/2026/10/the-third-party-agent-problem-why.html
  - https://hubs.ly/Q04zg1dw0
  - https://www.reco.ai/agent-ecosystem-security?utm_source=hackernews
  - https://www.reco.ai/platform?utm_source=hackernews
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: 
date: 2026-05-09
logsource:
  product: m365
  service: audit
detection:
  selection_operation:
    Operation|contains:
      - "Add service principal"
      - "Consent to application"
      - "Add OAuth2PermissionGrant"
      - "Add app role assignment grant"
      - "Add application"
  selection_appname:
    ApplicationName|contains:
      - "AI"
      - "Agent"
      - "Bot"
      - "Assistant"
      - "Copilot"
      - "ChatGPT"
      - "Claude"
      - "Gemini"
      - "LLM"
      - "OpenAI"
      - "Anthropic"
      - "Reco"
  condition: selection_operation and selection_appname
falsepositives:
  - Legitimate business-approved AI agents and third-party integrations.
  - Authorized OAuth consent by users for approved applications.
  - IT administrators creating or managing service principals for sanctioned AI tools.
  - Software deployment tools that create service principals with AI-related names.
level: high
tags:
  - attack.initial_access
  - attack.persistence
  - attack.privilege_escalation
  - attack.defense_evasion
  - attack.credential_access
  - attack.discovery
  - attack.t1078
  - attack.t1078.004
  - attack.t1098
  - attack.t1098.001
  - attack.t1550
  - attack.t1550.001
  - attack.t1136
  - attack.t1136.003