title: Suspicious GitHub Actions Workflow Creation or Update Using Stolen Token
id: ""
status: draft
description: Detects GitHub audit events where GitHub Actions workflows are created or updated using a personal access token, OAuth access token, or GitHub App token by an actor that is not recognized as trusted CI/CD automation. This behavior aligns with Gheist/GhostAction abuse of stolen GitHub tokens to inject malicious Actions workflows and exfiltrate private repository secrets.
references:
  - https://thehackernews.com/2026/10/gheist-uses-stolen-github-tokens-to.html
  - https://github.blog/changelog/2026-07-28-github-actions-holds-potentially-malicious-workflows-for-approval/
  - https://www.wiz.io/blog/gheist-attempted-scaled-abuse-of-stolen-github-tokens-stumbles
  - https://docs.github.com/en/actions/reference/security/secure-use
  - https://thehackernews.com/2026/10/ghostaction-compromises-about-1900.html
  - https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/
  - https://thehackernews.com/2026/03/trivy-security-scanner-github-actions.html
  - https://thehackernews.com/2026/07/north-korean-hackers-publish-108.html
  - https://thehackernews.com/2026/05/megalodon-github-attack-targets-5561.html
  - https://docs.github.com/en/actions/reference/security/oidc
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026/05/07
logsource:
  category: application
  product: github
  service: audit
detection:
  selection_action:
    action:
      - 'workflows.created'
      - 'workflows.updated'
  selection_token_type:
    programmatic_access_type:
      - 'Personal access token'
      - 'Fine-grained personal access token'
      - 'OAuth access token'
      - 'GitHub App'
  filter_known_automation:
    actor:
      - 'github-actions[bot]'
      - 'dependabot[bot]'
      - 'renovate[bot]'
      - 'trusted-ci-bot'
  condition: selection_action and selection_token_type and not filter_known_automation
falsepositives:
  - Authorized developers or CI/CD automation legitimately creating or updating GitHub Actions workflows with personal access tokens or OAuth tokens.
  - Dependency update and security bots such as Dependabot or Renovate.
  - Organization-specific service accounts or bots not listed; tune the actor allowlist and baseline normal workflow-change repositories.
level: high
tags:
  - attack.t1078
  - attack.t1098
  - attack.t1195.002
  - attack.t1528
  - attack.t1550.001
  - attack.t1552.001
  - attack.t1567