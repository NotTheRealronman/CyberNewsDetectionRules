title: NodeRabbit/Pollcat Execution via Recruitment-Themed Coding Test
id:
status: draft
description: Detects execution of Node.js/Python interpreters or known Mirage Kitten/Nimbus Manticore backdoor names in recruitment-themed coding test directories. This behavior is associated with Iranian threat actors posing as recruiters and delivering cross-platform RATs such as NodeRabbit and Pollcat.
references:
  - https://thehackernews.com/2026/09/iranian-hackers-pose-as-recruiters-to.html
  - https://securelist.com/mirage-kitten-new-backdoors-noderabbit-pollcat/121244/
  - https://thehackernews.com/2026/07/nimbus-manticore-deploys-nightledger.html
  - https://thehackernews.com/2026/08/nimbus-manticore-expands-toolset-with.html
  - https://thehackernews.com/2026/05/iranian-hackers-deploy-minifast-and.html
author:
date: 2026-05-07
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_event:
    EventID: 1
  selection_known:
    CommandLine|contains:
      - 'pollcat'
      - 'noderabbit'
      - 'node_rabbit'
      - 'node-rabbit'
  selection_suspicious:
    Image|endswith:
      - '\node.exe'
      - '\python.exe'
      - '\python3.exe'
      - '\pollcat.exe'
      - '\noderabbit.exe'
    CommandLine|contains:
      - 'server.js'
      - 'main.js'
      - 'index.js'
      - 'app.js'
      - 'test.js'
    CurrentDirectory|contains:
      - 'coding'
      - 'interview'
      - 'recruit'
      - 'challenge'
      - 'assessment'
      - 'hiring'
      - 'job'
  condition: selection_event and (selection_known or selection_suspicious)
falsepositives:
  - Legitimate coding challenge and interview assessment environments where developers run Node.js or Python scripts.
  - Development projects with names containing "coding", "test", "job", or "interview" and common script filenames such as server.js, main.js, or app.js.
  - Whitelist known internal development directories, trusted package repositories, and approved developer workstations.
level: high
tags:
  - attack.t1566.001
  - attack.t1059
  - attack.t1059.006
  - attack.t1059.007
  - attack.t1071.001
  - attack.t1105