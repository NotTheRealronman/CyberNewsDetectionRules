title: LiteLLM AI Gateway Credential Exposure via Malicious Package
id: ""
status: draft
description: Detects GitHub token material, gateway secret references, and suspicious package installation or execution behavior in LiteLLM AI gateway application logs consistent with the reported malicious LiteLLM package supply-chain activity and suspected GitHub token leak.
references:
  - https://thehackernews.com/2026/10/litellm-suspects-github-token-leak-in.html
  - https://docs.litellm.ai/blog/security-incident-oct-21-2026
  - https://thehackernews.com/2026/10/litellm-compromised-in-supply-chain.html
  - https://github.com/BerriAI/litellm/issues/47826
  - https://research.jfrog.com/post/litellm-hijacked-again/
  - https://www.aikido.dev/blog/litellm-compromised-infostealer-rat
  - https://www.wiz.io/blog/litellm-compromised-steals-credentials
  - https://docs.litellm.ai/blog/security-update-march-2026
  - https://www.trendmicro.com/en_gb/research/26/c/inside-litellm-supply-chain-compromise.html
  - https://thehackernews.com/2026/03/teampcp-backdoors-litellm-versions.html
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-05-07
logsource:
  category: application
  product: litellm
  service: gateway
detection:
  selection_github_token:
    message|re: '(?i)(gh[pousr]_[A-Za-z0-9_]{36,255}|github_pat_[A-Za-z0-9_]{20,255})'
  selection_github_context:
    message|contains:
      - 'GITHUB_TOKEN'
      - 'Authorization: token'
      - 'Authorization: Bearer'
      - 'api.github.com'
      - 'github.com'
      - 'git clone'
  selection_secret_material:
    message|contains:
      - 'OPENAI_API_KEY'
      - 'ANTHROPIC_API_KEY'
      - 'AZURE_OPENAI_KEY'
      - 'AWS_SECRET_ACCESS_KEY'
      - 'AWS_ACCESS_KEY_ID'
      - 'GITHUB_TOKEN'
      - 'LITELLM_MASTER_KEY'
  selection_litellm_package:
    message|contains:
      - 'litellm'
  selection_suspicious_install:
    message|contains:
      - 'pip install'
      - 'pip3 install'
      - 'python -m pip'
      - 'setup.py'
      - 'postinstall'
      - 'curl '
      - 'wget '
      - 'base64 -d'
      - '/tmp/'
      - 'chmod +x'
      - 'python -c'
      - 'subprocess'
      - 'os.system'
  filter_redacted:
    message|contains:
      - 'REDACTED'
      - 'redacted'
      - 'masked'
      - '********'
      - '[REDACTED]'
  condition: (selection_github_token or (selection_github_context and selection_secret_material) or (selection_litellm_package and selection_suspicious_install)) and not filter_redacted
fields:
  - timestamp
  - host
  - user
  - process
  - src_ip
  - dest_ip
  - url
  - message
falsepositives:
  - Legitimate CI/CD, deployment, or package-management jobs that install or update LiteLLM and reference GitHub or AI-provider secrets; verify allow-listed runners, service accounts, and maintenance windows.
  - Security scanners, secret-scanning alerts, and redacted log lines containing token placeholders or masked values.
  - Administrative troubleshooting commands that use pip, curl, wget, base64, or /tmp paths against non-production LiteLLM hosts.
level: high
tags:
  - attack.initial_access
  - attack.t1195.002
  - attack.credential_access
  - attack.t1552.001
  - attack.exfiltration
  - attack.t1048
  - attack.command_and_control
  - attack.t1071
  - attack.execution
  - attack.t1059.006