title: "Compromised MemTensor npm/PyPI Packages Spawn Suspicious Child Processes (sckit Credential Stealer)"
id: 
status: draft
description: "Detects suspicious child process execution from npm, npx, yarn, pnpm, pip, or python package managers on Windows, indicative of the sckit credential stealer delivered via compromised MemTensor packages. The malware leverages post-install scripts to execute commands, download additional payloads, and access credential files."
references:
  - "https://thehackernews.com/2026/09/compromised-memtensor-packages-deliver.html"
  - "https://www.aikido.dev/blog/supplychain-local-memtensor-npm-pypi"
  - "https://safedep.io/memtensor-sckit-worm-npm-pypi/"
  - "https://socket.dev/blog/memtensor-compromise"
  - "https://www.stepsecurity.io/blog/sckit-supply-chain-worm-hits-memtensor-npm-pypi-scopes"
  - "https://safedep.io/sckit-go-implant-framework/"
author: 
date: "2026-05-07"
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\node.exe'
      - '\npm.cmd'
      - '\npx.cmd'
      - '\yarn.cmd'
      - '\pnpm.cmd'
      - '\pip.exe'
      - '\python.exe'
      - '\python3.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\curl.exe'
      - '\wget.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\mshta.exe'
      - '\sckit.exe'
      - '\sckit'
  selection_cmd:
    CommandLine|contains:
      - 'sckit'
      - 'memtensor'
      - 'Invoke-WebRequest'
      - 'DownloadString'
      - 'DownloadFile'
      - 'curl'
      - 'wget'
      - 'base64'
      - 'FromBase64String'
      - '%TEMP%'
      - '\AppData\Local\Temp'
      - '.aws\credentials'
      - '.ssh\id_rsa'
      - '.npmrc'
      - '.pypirc'
      - 'npm token'
      - 'pypi token'
  condition: selection_parent and (selection_child or selection_cmd)
falsepositives:
  - "Legitimate package installation scripts that execute shell commands for native module compilation or setup."
  - "Administrative scripts that use npm/pip and curl/wget for legitimate downloads."
  - "Software build pipelines that run post-install scripts."
level: high
tags:
  - attack.initial_access
  - attack.execution
  - attack.persistence
  - attack.credential_access
  - attack.exfiltration
  - attack.t1195.001
  - attack.t1059.001
  - attack.t1059.003
  - attack.t1552.001
  - attack.t1041
  - attack.t1105