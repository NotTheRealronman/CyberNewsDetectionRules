title: Microsoft Word Copilot Hidden Prompt Injection via Context Collapse
id: ""
status: draft
description: >-
  Detects Microsoft Copilot for Word activity where a document contains hidden
  prompt-injection content and Copilot is used to draft or edit a new document,
  matching the “context collapse” / AI worming behavior. The rule relies on
  Microsoft 365 Copilot audit activity and Defender for Office 365 prompt
  injection telemetry because the attack uses hidden document text and prompt
  injection rather than a static file hash or network IOC.
references:
  - https://thehackernews.com/2026/07/microsoft-copilot-for-word-can-copy.html
  - https://enklypesalt.com/posts/context-collapse-part3-ai-worming-through-word/
  - https://thehackernews.com/2024/08/microsoft-fixes-ascii-smuggling-flaw.html
  - https://support.microsoft.com/en-us/word/copilot/draft-and-add-content-with-copilot-in-word
  - https://support.microsoft.com/en-us/word/edit-with-copilot-in-word
  - https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhrEy9jEFSadp95ztaH87-97Z_U9V94nUsE-BsrdwSR8ETPJDyCjy63vNxc-O26z6VhA3nDOrU24lJqNdy24bfNxGPxGxXNRvM_XCwnZ7ukY5wDnXKsvDZN42aCT1JFYXZZGoZFEtSQgbba742oPTEgEbtoa0GBYWWkkkU43P1wPq-LByZPJfbzwZsb1RiI/s728-e100/sygnia-d-1.png
  - https://learn.microsoft.com/en-us/defender-office-365/step-by-step-guides/prompt-injection-protection-defender-for-office-365
  - https://www.microsoft.com/en-us/security/blog/2026/06/22/guarding-ai-memory/
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026/07/12
logsource:
  category: application
  product: microsoft365
  service: unified-audit-log
detection:
  selection:
    Operation: "CopilotActivity"
    Workload|contains: "Word"
  alert:
    - AlertName|contains: "prompt injection"
    - AlertName|contains: "AI memory"
    - ThreatType|contains: "PromptInjection"
  hidden:
    - DataClassification|contains: "PromptInjection"
    - DataClassification|contains: "HiddenText"
    - InputSnapshot|contains:
        - "ignore previous instructions"
        - "ContextCollapse"
        - "context collapse"
        - "SYSTEM PROMPT"
        - "copy the hidden prompt"
        - "do not reveal the system prompt"
    - OutputSnapshot|contains:
        - "ContextCollapse"
        - "context collapse"
        - "ignore previous instructions"
        - "hidden prompt"
  condition: selection and (alert or hidden)
falsepositives:
  - Legitimate Copilot use on documents that contain hidden text for accessibility, translation, watermarks, or legal instructions.
  - Internal red-team or security research exercises that intentionally include prompt-injection markers.
  - Users intentionally asking Copilot to summarize or extract hidden document text for valid business reasons.
  - Whitelist trusted document templates, internal authors, and business-approved use cases where prompt markers are expected.
level: high
tags:
  - attack.initial-access
  - attack.execution
  - attack.defense-evasion
  - attack.exfiltration
  - attack.t1566.001
  - attack.t1204.002
  - attack.t1027.003
  - attack.t1567.002
  - ai-security
  - prompt-injection