title: Microsoft Entra ID Credential Stuffing Spike from Autonomous AI Agents
id: ""
status: draft
description: >-
  Detects bursts of failed Microsoft Entra ID authentication attempts caused by
  autonomous AI-driven credential stuffing or password-spraying activity against
  cloud identity targets. The rule correlates repeated invalid sign-in errors
  from a single source IP over a short period to identify credential abuse
  before attackers can use valid credentials.
references:
  - https://thehackernews.com/2026/09/autonomous-ai-agents-compromise.html
  - https://cloud.google.com/blog/topics/threat-intelligence/from-prompting-to-autonomy-the-evolution-of-adversarial-ai
  - https://thehackernews.com/2026/05/hackers-used-ai-to-develop-first-known.html
  - https://thehackernews.com/2026/09/cisa-adds-seven-exploited-flaws-as.html
  - https://thehackernews.com/2026/03/trivy-supply-chain-attack-triggers-self.html
  - https://thehackernews.com/2026/09/russia-aligned-uac-0099-plants-nuclear.html
  - https://thehackernews.com/2026/04/new-wave-of-dprk-attacks-uses-ai.html
  - https://huggingface.co/blog/mlabonne/abliteration
author: ""
date: 2026-09-05
logsource:
  category: authentication
  product: azure
  service: signinlogs
detection:
  selection:
    ResultType:
      - '50126'
      - '50053'
  timeframe: 15m
  condition: selection | count() by IpAddress >= 15
falsepositives:
  - A legitimate user with stale credentials triggering temporary Azure AD lockout.
  - Legacy authentication clients reusing expired passwords.
  - Password manager or automation scripts attempting multiple password rotations.
  - Authorized penetration testing and red team assessments.
level: high
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.004
  - attack.t1078
  - attack.initial_access