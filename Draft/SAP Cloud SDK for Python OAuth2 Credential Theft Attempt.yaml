title: SAP Cloud SDK for Python OAuth2 Credential Theft Attempt
id:
status: draft
description: Detects attempts to exploit a critical CVSS 10 vulnerability in SAP Cloud SDK for Python that allows OAuth2 credential theft. The rule monitors for OAuth2 token requests directed to non-SAP domains, indicating a malicious redirect or SSRF-based token exfiltration.
references:
  - https://thehackernews.com/2026/10/sap-discloses-critical-cvss-10-flaw-in.html
  - https://github.com/SAP/cloud-sdk-python/security/advisories/GHSA-4mv3-jxxm-9cx2
  - https://github.com/SAP/cloud-sdk-python/releases/tag/v0.45.2
  - https://github.com/SAP/cloud-sdk-python/releases/tag/v0.55.1
  - https://pypi.org/project/sap-cloud-sdk/0.58.4/
author:
date: 2026-05-09
logsource:
  category: network
  product: zeek
  service: http
detection:
  selection:
    http.request.method: POST
    http.uri|contains:
      - '/oauth/token'
      - '/oauth2/token'
    http.host|not|endswith:
      - '.sap.com'
      - '.sap.hana.ondemand.com'
      - '.sapcloud.com'
    http.request_body|contains:
      - 'grant_type='
      - 'client_id='
  condition: selection
falsepositives:
  - Legitimate OAuth2 token exchanges with third-party or custom identity providers.
  - Internal applications using non-SAP OAuth2 servers.
  - Development or testing environments with custom OAuth2 endpoints.
  - Whitelist known and approved OAuth2 token endpoints and destination hosts.
level: critical
tags:
  - attack.credential_access
  - attack.t1528
  - attack.t1550
  - attack.t1078