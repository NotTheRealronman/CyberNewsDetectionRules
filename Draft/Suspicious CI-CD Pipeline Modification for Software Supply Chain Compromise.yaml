title: Suspicious CI/CD Pipeline Modification for Software Supply Chain Compromise
id: ""
status: draft
description: Detects suspicious modifications to CI/CD pipeline configuration files or package manifests that may indicate an attempt to inject malicious build steps, exfiltrate secrets, or introduce vulnerable dependencies. This rule aligns with software supply chain modernization efforts in financial services.
references:
  - https://thehackernews.com/2026/10/how-financial-services-companies-can.html
  - https://www.verizon.com/about/news/breach-industry-wide-dbir-finds
  - https://www.chainguard.dev/solutions/financial-services
  - https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ
author: ""
date: 2026-05-09
logsource:
  category: process_creation
  product: linux
  service: auditd
detection:
  selection_image:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
      - '/zsh'
      - '/curl'
      - '/wget'
      - '/python'
      - '/python3'
      - '/node'
      - '/npm'
      - '/yarn'
      - '/pnpm'
      - '/pip'
      - '/pip3'
      - '/git'
      - '/sed'
      - '/awk'
      - '/base64'
  selection_cli:
    CommandLine|contains:
      - '>>'
      - '>'
      - 'curl'
      - 'wget'
      - 'base64 -d'
      - 'eval'
      - 'exec'
      - 'chmod +x'
  selection_target:
    CommandLine|contains:
      - '.github/workflows'
      - '.gitlab-ci.yml'
      - 'Jenkinsfile'
      - '.circleci/config.yml'
      - 'azure-pipelines.yml'
      - 'bitbucket-pipelines.yml'
      - 'package.json'
      - 'requirements.txt'
      - 'postinstall'
      - 'preinstall'
      - 'npm install'
      - 'yarn add'
      - 'pip install'
      - 'git clone'
  condition: selection_image and selection_cli and selection_target
falsepositives:
  - Legitimate CI/CD pipeline updates by DevOps engineers.
  - Authorized package installations and dependency updates.
  - Automated build scripts that use curl/wget to download dependencies.
level: medium
tags:
  - attack.initial_access
  - attack.persistence
  - attack.supply_chain_compromise
  - attack.t1195
  - attack.t1195.001
  - attack.t1195.002
  - attack.t1059
  - attack.t1105