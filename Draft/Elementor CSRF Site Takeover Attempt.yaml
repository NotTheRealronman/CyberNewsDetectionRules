title: Elementor CSRF Site Takeover Attempt
id: ""
status: draft
description: Detects potential Cross-Site Request Forgery (CSRF) exploitation attempts targeting the Elementor WordPress plugin. Attackers can craft a link that, when clicked by an authenticated admin, performs unauthorized actions such as changing the admin email, modifying user roles, or installing/activating plugins, leading to site takeover.
references:
    - https://thehackernews.com/2026/09/elementor-csrf-flaw-lets-attackers-take.html
    - https://patchstack.com/articles/cross-site-request-forgery-in-elementor-plugin-affecting-2-million-sites/
    - https://elementor.com/pro/changelog/
    - https://wordpress.org/plugins/elementor/advanced/
author: ""
date: 2026-09-15
logsource:
    category: webserver
    product: wordpress
    service: access
detection:
    selection_uri:
        cs-uri-stem|endswith:
            - '/admin-ajax.php'
            - '/admin-post.php'
            - '/wp-admin/admin.php'
    selection_action:
        cs-uri-query|contains:
            - 'action=elementor_'
            - 'elementor_ajax'
            - 'elementor_save_settings'
            - 'elementor_update_settings'
            - 'elementor_role_manager'
            - 'elementor_install_plugin'
            - 'elementor_activate_plugin'
            - 'elementor_change_admin_email'
            - 'elementor_create_admin_user'
    condition: selection_uri and selection_action
falsepositives:
    - Legitimate administrator actions performed from the same site (e.g., manual settings changes, plugin installations, role management).
    - Automated tools or plugins that interact with Elementor admin endpoints.
    - To reduce false positives, correlate with the Referer header; a mismatched or external Referer may indicate a CSRF attempt. Consider whitelisting trusted IPs or admin sessions.
level: high
tags:
    - attack.initial_access
    - attack.privilege_escalation
    - attack.persistence
    - attack.t1190
    - attack.t1204.001