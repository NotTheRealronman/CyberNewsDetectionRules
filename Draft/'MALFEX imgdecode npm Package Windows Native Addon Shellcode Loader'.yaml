title: 'MALFEX imgdecode npm Package Windows Native Addon Shellcode Loader'
id: ''
status: draft
description: 'Detects execution and suspicious child-process behavior associated with the malicious npm package imgdecode, which uses a Windows native addon to load hidden shellcode. The rule looks for node/npm use of imgdecode, native addon paths, and child processes commonly used for payload staging or execution.'
references:
  - 'https://thehackernews.com/2026/10/malfex-npm-package-imgdecode-hides.html'
  - 'https://www.npmjs.com/package/imgdecode?activeTab=versions'
  - 'https://npm-stat.com/charts.html?package=imgdecode'
  - 'https://safedep.io/malfex-imgdecode-npm-native-addon-loader/'
  - 'https://thehackernews.com/2026/10/eight-malicious-npm-packages-downloaded.html'
  - 'https://socket.dev/npm/package/imgdecode/files/1.0.0/index.js'
  - 'https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ'
author: ''
date: '2026-04-26'
logsource:
  category: process_creation
  product: windows
  service: sysmon
detection:
  selection_imgdecode_process:
    Image|endswith: '\node.exe'
    CommandLine|contains:
      - 'imgdecode'
      - 'node_modules\imgdecode'
      - 'imgdecode.node'
  selection_imgdecode_npm_install:
    Image|endswith:
      - '\npm.cmd'
      - '\npm.exe'
      - '\node.exe'
    CommandLine|contains|all:
      - 'install'
      - 'imgdecode'
  selection_imgdecode_child:
    ParentImage|endswith: '\node.exe'
    ParentCommandLine|contains:
      - 'imgdecode'
      - 'node_modules\imgdecode'
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\cmd.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\mshta.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
      - '\curl.exe'
      - '\wget.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  selection_imgdecode_child_network:
    ParentImage|endswith: '\node.exe'
    ParentCommandLine|contains:
      - 'imgdecode'
      - 'node_modules\imgdecode'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'Invoke-WebRequest'
      - 'DownloadString'
      - 'certutil'
      - 'bitsadmin'
  condition: selection_imgdecode_process or selection_imgdecode_npm_install or selection_imgdecode_child or selection_imgdecode_child_network
falsepositives:
  - 'Legitimate npm development workflows where node.exe spawns cmd.exe or PowerShell for lifecycle scripts.'
  - 'Authorized testing or security research involving the imgdecode package; verify package version, hash, and source before suppression.'
  - 'Build systems or CI/CD runners that install npm packages and execute native addon build tooling; restrict by approved package registry, package hash, and parent command line.'
level: high
tags:
  - attack.t1195.001
  - attack.t1204
  - attack.t1059.007
  - attack.t1027
  - attack.t1105
  - attack.t1055
  - attack.t1620
  - attack.t1218