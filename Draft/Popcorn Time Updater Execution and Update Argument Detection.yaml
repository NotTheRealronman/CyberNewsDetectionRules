title: Popcorn Time Updater Execution and Update Argument Detection
id: ""
status: draft
description: Detects execution of Popcorn Time or its updater component with update-related arguments or as a child process of Popcorn Time. This behavior can indicate vulnerable Time4Popcorn updater activity related to CVE-2026-30612 and Operation Ixim, where abuse of the update mechanism could deliver unauthorized updates or support botnet recruitment.
references:
  - "https://thehackernews.com/2026/10/researchers-push-over-2-million-updates.html"
  - "https://labs.eye.security/operation-ixim-preventing-a-botnet-of-millions-of-popcorn-time-users/"
  - "https://labs.eye.security/cve-2026-30612-a-vulnerability-in-time4popcorn-popcorntime/"
  - "https://thehackernews.com/2021/01/european-authorities-disrupt-emotet.html"
  - "https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ"
author: ""
date: 2026-10-24
logsource:
  category: process_creation
  product: windows
detection:
  selection_popcorn_update:
    Image|endswith:
      - '\Popcorn Time.exe'
      - '\PopcornTime.exe'
      - '\popcorn-time.exe'
    CommandLine|contains:
      - '--update'
      - '--updated'
      - 'updater'
      - 'update'
      - 'install'
      - 'silent'
  selection_parent_popcorn:
    ParentImage|endswith:
      - '\Popcorn Time.exe'
      - '\PopcornTime.exe'
      - '\popcorn-time.exe'
  selection_updater:
    Image|endswith:
      - '\Updater.exe'
      - '\PopcornTimeUpdater.exe'
      - '\Popcorn Time Updater.exe'
    CommandLine|contains:
      - '--update'
      - 'update'
      - 'install'
      - 'silent'
  condition: selection_popcorn_update or (selection_parent_popcorn and selection_updater)
falsepositives:
  - Legitimate Popcorn Time update checks, installations, or user-initiated updates
  - Authorized software deployment, troubleshooting, or forensic activity involving Popcorn Time
  - Exclude known approved Popcorn Time binaries and update servers after verification by IT
level: medium
tags:
  - attack.initial_access
  - attack.t1195.002
  - attack.execution
  - attack.t1059
  - attack.command_and_control
  - attack.t1071.001
  - attack.t1105
  - attack.lateral_movement
  - attack.t1072