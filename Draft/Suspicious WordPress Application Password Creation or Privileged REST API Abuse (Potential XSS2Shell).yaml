title: Suspicious WordPress Application Password Creation or Privileged REST API Abuse (Potential XSS2Shell)
id:
status: draft
description: >
  Detects activity commonly observed during exploitation of the WordPress pre-auth XSS
  vulnerability fixed in WordPress 7.0.3. The attacker chains the XSS with the WordPress
  Application Passwords REST API to create a persistent authentication mechanism, then uses
  the generated Application Password to perform privileged REST API actions such as plugin,
  theme, or user management. These actions can lead to server-side PHP code execution and
  web shell deployment.
references:
  - https://thehackernews.com/2026/08/new-wordpress-pre-auth-xss-could-lead.html
  - https://pwn.ai/blog/xss2shell
  - https://wordpress.org/news/2026/08/wordpress-7-0-3-release/
  - https://developer.wordpress.org/advanced-administration/security/application-passwords/
author:
date: 2026-08-05
logsource:
  category: application
  product: wordpress
  service: rest_api
detection:
  selection:
    - http.method: 'POST'
      http.url|endswith: '/application-passwords'
    - http.method: 'POST'
      http.url|contains:
        - '/wp-json/wp/v2/plugins'
        - '/wp-json/wp/v2/themes'
        - '/wp-json/wp/v2/users'
  condition: selection
falsepositives:
  - Legitimate administrators creating Application Passwords from the WordPress user profile page.
  - Authorized plugin or integration clients managing plugins/themes via the REST API.
  - Administrative user provisioning scripts using the REST API to create or manage users.
  - To reduce false positives, correlate with valid session nonces, authenticated admin context, known User-Agent strings, and allowlisted IP addresses or integration endpoints.
level: critical
tags:
  - attack.t1190
  - attack.t1189
  - attack.t1078
  - attack.t1098
  - attack.t1059.007
  - attack.t1059.006
  - attack.t1505.003