title: 'PHP Session Upload Progress Payload to Web Shell Code Execution (phpAfterShell)'
id: ''
status: draft
description: 'Detects attempted exploitation of PHP session handling via PHP_SESSION_UPLOAD_PROGRESS and PHP code payloads in multipart requests, consistent with phpAfterShell turning a PHP session flaw into web shell code execution.'
references:
  - 'https://thehackernews.com/2026/11/phpaftershell-explained-how-hackers.html'
  - 'https://thehackernews.com/2026/11/php-fixes-7-critical-flaws-including.html'
  - 'https://thehackernews.com/2026/10/php-issues-emergency-patches-for-two.html'
  - 'https://github.com/php/php-src/security/advisories/GHSA-fm2m-fjf5-v3cp'
  - 'https://depthfirst.com/research/phpaftershell'
  - 'https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ'
author: ''
date: 2026-05-07
logsource:
  category: webserver
  product: apache
  service: modsecurity_audit
detection:
  selection_method:
    cs-method: 'POST'
  selection_upload_progress:
    request_body|contains:
      - 'PHP_SESSION_UPLOAD_PROGRESS'
      - 'session.upload_progress'
      - 'session.upload_progress.name'
  selection_php_payload:
    request_body|contains:
      - '<?php'
      - '<?='
      - '%3C%3Fphp'
      - '%3C%3F%3D'
      - 'eval('
      - 'assert('
      - 'system('
      - 'exec('
      - 'shell_exec('
      - 'passthru('
      - 'popen('
      - 'proc_open('
      - 'base64_decode('
      - 'gzinflate('
      - 'str_rot13('
      - 'create_function('
      - 'preg_replace('
      - 'php://input'
      - 'data://'
      - 'phar://'
      - 'expect://'
      - 'auto_prepend_file'
      - 'auto_append_file'
      - '$_GET'
      - '$_POST'
      - '$_REQUEST'
      - '$_SERVER'
      - '${'
  selection_uri_payload:
    cs-uri-query|contains:
      - 'PHP_SESSION_UPLOAD_PROGRESS'
      - 'session.upload_progress'
      - 'cmd='
      - 'exec='
      - 'shell='
      - 'system='
      - 'passthru='
      - 'phpinfo'
      - 'auto_prepend_file'
      - 'auto_append_file'
      - 'php://filter'
      - 'php://input'
      - 'data://'
      - 'phar://'
      - 'expect://'
      - '/var/lib/php/sessions'
      - '/var/lib/php/session'
      - '/tmp/sess_'
      - 'sess_'
  selection_user_agent:
    cs-user-agent|contains:
      - 'phpAfterShell'
      - 'php-after-shell'
      - 'PHPAFTERSHELL'
  condition: selection_method and (selection_upload_progress and selection_php_payload) or (selection_method and selection_uri_payload) or (selection_method and selection_user_agent)
falsepositives:
  - 'Legitimate PHP upload progress implementations that include the PHP_SESSION_UPLOAD_PROGRESS field; validate with application owners and allow known endpoints.'
  - 'Security scanners, penetration tests, or application diagnostics that submit PHP code snippets; exclude authorized scanner ranges and test hosts.'
  - 'Web application features that accept PHP source code or serialized data for administrative or debugging purposes; whitelist known application paths and user agents.'
level: critical
tags:
  - attack.initial_access
  - attack.t1190
  - attack.execution
  - attack.t1059.004
  - attack.persistence
  - attack.t1505.003
  - attack.defense_evasion
  - attack.t1027