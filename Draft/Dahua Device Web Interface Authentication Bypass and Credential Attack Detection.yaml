title: Dahua Device Web Interface Authentication Bypass and Credential Attack Detection
id: ""
status: draft
description: Detects HTTP requests targeting Dahua camera/NVR web login endpoints with authentication bypass cookie patterns associated with CVE-2021-33044. This behavior is consistent with Operation CameraSWARM, in which more than 14,500 Dahua devices were compromised using credential attacks, authentication bypasses, and abuse of the Dahua P2P relay mechanism.
references:
  - "https://thehackernews.com/2026/08/hackers-compromised-14500-dahua-devices.html"
  - "https://hunt.io/blog/operation-cameraswarm-dahua-cameras-compromised"
  - "https://labs.itresit.es/2025/10/29/dahua-beyond-cve-2025-31702-p2p-relay-exposure/"
  - "https://www.dahuasecurity.com/about-dahua/trust-center/dahua-psirt/dhcc-sa-202106-001:security-advisory---identity-authentication-bypass-vulnerability-found-in-some-dahua-products"
  - "https://nvd.nist.gov/vuln/detail/CVE-2021-33044"
  - "https://seclists.org/fulldisclosure/2021/Oct/13"
  - "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
  - "https://github.com/thebadinteger/p2pwn"
  - "https://github.com/khoanguyen-3fc/dh-p2p"
  - "https://www.dahuasecurity.com/about-dahua/trust-center/dahua-psirt/security-advisory-%E2%80%93vulnerability-found-in-some-dahua-products"
  - "https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ"
author: ""
date: 2026-04-25
logsource:
  category: webserver
  product: dahua
  service: http
detection:
  selection_bypass:
    http.request.method: POST
    url.path|contains: "/RPC2_Login"
    http.request.headers.cookie|contains|all:
      - "user=admin"
      - "login=1"
      - "language=en"
  filter_trusted:
    source.ip|startswith:
      - "127."
      - "10."
      - "192.168."
      - "172.16."
  condition: selection_bypass and not filter_trusted
falsepositives:
  - Legitimate Dahua web management sessions from trusted administrative hosts that send the same cookie fields during login. Whitelist known management VLANs and source IPs.
  - Vulnerability scanners or penetration testing tools replaying CVE-2021-33044 proof-of-concept requests.
  - Enable Dahua syslog/audit logging and correlate successful authentication events with device serial numbers and known administrator IPs to reduce false positives.
level: high
tags:
  - attack.initial_access
  - attack.t1190
  - attack.t1078
  - attack.t1110
  - attack.t1133
  - attack.t1219
  - cve.2021.33044
  - cve.2025.31702
  - operation.cameraswarm