title: GhostAction GitHub Actions Credential Theft and OAuth Device Flow Abuse
id: ''
status: draft
description: Detects GitHub audit telemetry associated with GhostAction-style credential theft, including suspicious OAuth application authorization requesting repository/workflow scopes, creation or modification of GitHub Actions workflows with font-themed payload paths, and use of the my-gitlab.com exfiltration domain or related indicators.
references:
  - "https://thehackernews.com/2026/10/ghostaction-attackers-plant-credential.html"
  - "https://thehackernews.com/2026/10/ghostaction-compromises-about-1900.html"
  - "https://thehackernews.com/2026/10/credential-stealing-github-actions.html"
  - "https://opensourcemalware.com/blog/ghostaction-attack-escalates"
  - "https://opensourcemalware.com/blog/ghostaction-phishing-campaign"
  - "https://opensourcemalware.com/blog/ghostaction-copycats-polinrider-by-hiding-a-stealer-in-a-fake-font-file"
  - "https://www.virustotal.com/gui/url/65d01eddf5e47f5f92bbb139052c3eee0f17e8a65e1206491ca382b282874f8b"
  - "https://www.virustotal.com/gui/domain/my-gitlab.com"
  - "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps#device-flow"
  - "https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/scopes-for-oauth-apps"
  - "https://thehackernews.com/2026/09/microsoft-takes-down-eviltokens-device.html"
  - "https://news.google.com/publications/CAAqLQgKIidDQklTRndnTWFoTUtFWFJvWldoaFkydGxjbTVsZDNNdVkyOXRLQUFQAQ"
author: ''
date: 2026-05-07
logsource:
  category: application
  product: github
  service: audit
detection:
  selection_oauth:
    action|contains:
      - 'oauth_authorization'
      - 'oauth_application'
      - 'personal_access_token'
    scopes|contains:
      - 'repo'
      - 'workflow'
      - 'write:packages'
      - 'admin:org'
      - 'delete_repo'
      - 'admin:repo_hook'
  selection_workflow:
    action|startswith:
      - 'workflows.'
      - 'workflow_run.'
    workflow_path|endswith:
      - '.yml'
      - '.yaml'
    workflow_path|contains:
      - 'font'
      - 'woff'
      - 'ttf'
      - 'otf'
      - 'update'
      - 'build'
  selection_ioc:
    - 'my-gitlab.com'
    - '65d01eddf5e47f5f92bbb139052c3eee0f17e8a65e1206491ca382b282874f8b'
    - 'GhostAction'
    - 'ghostaction'
    - 'woff2'
    - 'base64'
    - 'GITHUB_TOKEN'
    - 'ACTIONS_RUNTIME_TOKEN'
  condition: selection_ioc or selection_oauth or selection_workflow
falsepositives:
  - Legitimate OAuth applications and GitHub Apps requesting repository or workflow scopes during approved CI/CD onboarding.
  - Authorized GitHub Actions workflow updates that include font-related filenames, build/update paths, or base64 encoding in normal release automation.
  - Security testing or purple-team activity using the referenced indicators in controlled repositories.
level: high
tags:
  - attack.initial_access
  - attack.t1566
  - attack.credential_access
  - attack.t1528
  - attack.t1552
  - attack.defense_evasion
  - attack.t1027
  - attack.execution
  - attack.t1204
  - attack.command_and_control
  - attack.t1105
  - attack.exfiltration
  - attack.t1567
  - attack.persistence
  - attack.t1078